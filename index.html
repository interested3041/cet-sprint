<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>四六级冲刺背诵 · 20 天</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2733; --sub:#6b7686; --line:#e6eaf2;
  --brand:#2563eb; --brand2:#0d9488; --read:#2563eb; --write:#7c3aed; --trans:#0d9488; --listen:#ea580c;
  --ok:#16a34a; --no:#dc2626; --warn:#d97706; --chip:#eef2ff;
  --shadow:0 1px 3px rgba(20,30,60,.08),0 6px 20px rgba(20,30,60,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 80px}
header{position:static;background:transparent;border-bottom:1px solid var(--line)}
.hbar{max-width:860px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;letter-spacing:.5px}
.logo b{color:var(--brand)}
.count{font-size:12px;color:var(--sub);background:var(--chip);padding:3px 9px;border-radius:20px;font-weight:600}
.count b{color:var(--no);font-size:14px}
.hbtns{margin-left:auto;display:flex;gap:6px}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.hbtn:hover{border-color:var(--brand);color:var(--brand)}
.days{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;max-width:860px;margin:0 auto;scrollbar-width:thin}
.daychip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:center;min-width:62px;transition:.15s}
.daychip .dn{font-weight:700;font-size:13px}
.daychip .dd{font-size:10px;color:var(--sub)}
.daychip .tag{font-size:9px;padding:0 4px;border-radius:4px;margin-top:2px;display:inline-block}
.tag.new{background:#dbeafe;color:#1d4ed8}
.tag.rev{background:#fef3c7;color:#b45309}
.daychip.active{border-color:var(--brand);background:var(--brand);color:#fff}
.daychip.active .dd{color:#dbeafe}
.daychip.today{box-shadow:0 0 0 2px var(--brand2) inset}
.tabs{position:sticky;top:0;z-index:25;display:flex;gap:6px;margin:10px -14px 8px;padding:8px 14px 6px;flex-wrap:nowrap;overflow-x:auto;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:70px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;cursor:pointer;text-align:center;font-weight:700;font-size:13px;transition:.15s}
.tab small{display:block;font-weight:500;font-size:10px;color:var(--sub)}
.tab.active{color:#fff;border-color:transparent}
.tab.active small{color:rgba(255,255,255,.85)}
.tab[data-c=reading].active{background:var(--read)}
.tab[data-c=writing].active{background:var(--write)}
.tab[data-c=translation].active{background:var(--trans)}
.tab[data-c=listening].active{background:var(--listen)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.switch{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);padding:5px 9px;border-radius:8px}
.switch input{accent-color:var(--brand)}
.prog{font-size:12px;color:var(--sub);margin-left:auto;font-weight:600}
.prog b{color:var(--ok)}
.tip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--sub);margin-bottom:12px;box-shadow:var(--shadow)}
.tip b{color:var(--ink)}
.tip .toggle{cursor:pointer;color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);transition:.15s}
.card.known{border-left:4px solid var(--ok)}
.card.unknown{border-left:4px solid var(--no)}
.card .revbadge{font-size:10px;background:#fef3c7;color:#b45309;padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:600}
.wline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.word{font-size:18px;font-weight:800;letter-spacing:.3px}
.ph{font-size:12px;color:var(--sub);font-family:"Segoe UI",monospace}
.spk{border:none;background:var(--chip);color:var(--brand);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.spk:hover{background:var(--brand);color:#fff}
.mean{font-size:14px;margin-top:4px;color:var(--ink)}
.col{font-size:12.5px;color:var(--brand2);margin-top:3px}
.sent{margin-top:8px;padding:8px 10px;background:#f8fafc;border-radius:8px;font-size:14px}
.sent .en{font-weight:600}
.sent .cn{color:var(--sub);font-size:12.5px;margin-top:2px}
.note{font-size:12.5px;color:var(--warn);margin-top:6px;background:#fffbeb;padding:6px 9px;border-radius:7px}
.hidebox{margin-top:8px}
.revealbtn{border:1px dashed var(--brand);background:transparent;color:var(--brand);font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.hidden{display:none!important}
.marks{display:flex;gap:6px;margin-top:9px}
.mk{border:1px solid var(--line);background:var(--card);font-size:12px;padding:4px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.mk.yes:hover,.mk.yes.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.mk.no:hover,.mk.no.on{background:var(--no);color:#fff;border-color:var(--no)}
.dict{margin-top:8px}
.dict textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:54px}
.dict .row{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.btn{border:none;background:var(--brand);color:#fff;font-size:12.5px;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--chip);color:var(--brand)}
.score{font-size:12px;font-weight:700}
.diff{font-size:13.5px;margin-top:6px;line-height:1.9}
.diff .ok{color:var(--ok)}
.diff .miss{color:var(--no);text-decoration:line-through;opacity:.8}
.diff .extra{color:var(--warn);text-decoration:underline}
.diff .lab{font-size:11px;color:var(--sub);display:block;margin-top:4px}
.task{background:linear-gradient(135deg,#eef2ff,#f0fdfa);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;box-shadow:var(--shadow)}
.task h3{margin:0 0 6px;font-size:15px}
.task .prompt{font-size:13px;color:var(--sub);margin-bottom:8px}
.task .model{background:var(--card);border-radius:8px;padding:10px;font-size:14px}
.task .model .en{font-weight:600}
.task .model .cn{color:var(--sub);font-size:12.5px;margin-top:4px}
.task mark{background:#fde68a;padding:0 2px;border-radius:3px;font-weight:700}
.section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.section h2{font-size:16px;margin:0 0 10px}
.section h4{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.section p,.section li{font-size:13.5px;color:var(--ink)}
.section ul{padding-left:20px;margin:6px 0}
.sync-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:var(--card)}
.sync-title{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.sync-title small{font-weight:400;color:var(--sub);font-size:11.5px}
.sync-desc{font-size:12.5px;color:var(--sub);line-height:1.6;margin:5px 0 0}
.sync-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sync-actions .btn{padding:8px 14px;font-size:13px}
.sync-toast{font-size:12px;color:var(--ok);min-height:18px;margin-top:6px}
#syncToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,420px);min-height:0;margin:0;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 8px 28px rgba(15,23,42,.18);text-align:center;display:none}
#syncToast:not(:empty){display:block}
.sync-error{color:#b45309}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modal.open{display:flex}
.modal .box{background:var(--bg);border-radius:14px;max-width:720px;width:100%;padding:18px;margin:auto}
.modal .close{float:right;border:none;background:var(--card);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.empty{text-align:center;color:var(--sub);padding:30px;font-size:13px}
/* 每日小测 */
.qbanner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:13px;box-shadow:var(--shadow)}
.qbanner .btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff}
.qbanner .btn.ghost{background:transparent;border-color:rgba(255,255,255,.5)}
.qbanner b{font-size:14px}
.tab[data-c=quiz].active{background:#0f766e}
.tab[data-c=errbook].active{background:#b91c1c}
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-bottom:10px}
.qhead b{color:var(--ink);font-size:15px}
.qscore{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-bottom:12px}
.qscore b{font-size:16px}
.qblock{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fcfdff}
.qh{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.qtag{font-size:10px;color:#fff;padding:2px 7px;border-radius:5px;font-weight:700}
.qtag.l{background:var(--listen)}.qtag.r{background:var(--read)}.qtag.t{background:var(--trans)}.qtag.w{background:var(--write)}
.qhint{font-size:12px;color:var(--sub);margin-bottom:8px}
.qstory{font-size:13.5px;background:#fff7ed;border-left:3px solid var(--listen);padding:8px 10px;border-radius:8px;margin-bottom:8px;line-height:1.8}
.qpassage{font-size:14px;background:#f8fafc;border-radius:8px;padding:10px;margin-bottom:8px;line-height:1.8}
.qplay{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qitem{margin:10px 0 4px;font-size:13.5px}
.qitem .qn{font-weight:700;color:var(--brand);margin-bottom:4px}
.opt{display:flex;gap:7px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:5px 0;font-size:13px;cursor:pointer;background:#fff}
.opt input{margin-top:3px;accent-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:#f0fdf4}
.opt.no{border-color:var(--no);background:#fef2f2}
.qwhy{font-size:12.5px;color:#92400e;background:#fffbeb;border-radius:7px;padding:6px 9px;margin-top:6px;line-height:1.7}
.qinput{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;font-family:inherit;min-height:86px;resize:vertical;line-height:1.7}
.qref{font-size:13.5px;background:#f8fafc;border-radius:8px;padding:9px;margin-top:8px;line-height:1.8}
.qref .lab{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.qres{font-size:12.5px;margin-top:6px}
.qres .ok{color:var(--ok);font-weight:700}
.qres .no{color:var(--no);font-weight:700}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.chipw{font-size:11.5px;background:var(--chip);color:var(--brand);padding:2px 8px;border-radius:20px;font-weight:600}
.chipw.on{background:#dcfce7;color:#166534}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
[class*="watermark"],[id*="watermark"],[class*="Watermark"],.ai-watermark{display:none!important}
/* 错词本 */
.errfilter{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fchip{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer;font-weight:600}
.fchip.on{background:#0f766e;color:#fff;border-color:#0f766e}
.errbadge{font-size:10px;background:#fee2e2;color:#991b1b;padding:1px 6px;border-radius:5px;font-weight:600;margin-left:6px}
.errq{font-size:13.5px;background:#fef2f2;border-left:3px solid var(--no);border-radius:8px;padding:8px 10px;margin:7px 0}
.fab{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--brand);font-size:18px;font-weight:800;box-shadow:var(--shadow);display:none;cursor:pointer}
.fab.on{display:block}
.lockscreen{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.lockscreen.open{display:flex}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;width:100%;max-width:360px;box-shadow:var(--shadow);text-align:center}
/* 夜间模式 */
body.dark{--bg:#0f141b;--card:#161c25;--ink:#e6eaf2;--sub:#96a0ae;--line:#26303c;--chip:#1d2735;--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25)}
body.dark header{background:rgba(15,20,27,.92)}
body.dark .sent,body.dark .qpassage,body.dark .qref,body.dark .opt,body.dark .task .model,body.dark .model{background:#1b2430}
body.dark .qblock{background:#141a22}
body.dark .qstory{background:#2a1d12;color:#f3d9c0}
body.dark .qwhy,body.dark .note{background:#2a2115;color:#f2c37a}
body.dark .qscore{background:#10281e;border-color:#1e5b42;color:#8fe3b7}
body.dark .task{background:#141a22}
body.dark .opt.ok{background:#12291f}
body.dark .opt.no,body.dark .errq{background:#2b1717}
body.dark .errbadge{background:#3b1d1d;color:#fca5a5}
body.dark .card.unknown{border-left-color:var(--no)}
footer{text-align:center;color:var(--sub);font-size:11px;padding:20px}
@media(max-width:520px){
  .wrap{padding:0 10px calc(90px + env(safe-area-inset-bottom))}
  .word{font-size:17px}
  .spk{width:34px;height:34px;font-size:16px}
  .mk{padding:8px 15px;font-size:13px}
  .tab{padding:10px 4px}
  .sent{font-size:13.5px;padding:9px}
  .dict textarea{font-size:16px;min-height:64px}
  .revealbtn{padding:8px 16px}
  .hbtn{padding:7px 11px}
  .hbtns{width:100%;margin-left:0;justify-content:flex-end}
  .prog{width:100%;margin-left:0}
  .daychip{min-width:66px}
  .tabs{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
  .modal .box{padding:14px}
  .qinput{font-size:16px;min-height:96px}
  .qbanner{font-size:12.5px;padding:9px 10px}
}
input,textarea,button{font-family:inherit}

#gate{position:fixed;inset:0;z-index:80;background:radial-gradient(1200px 600px at 10% -10%,#dbe6ff 0,transparent 60%),#f5f7ff;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate.open{display:flex}
.g-card{width:100%;max-width:420px;box-sizing:border-box;background:#fff;border:1px solid #e5e9f4;border-radius:20px;padding:22px 16px;box-shadow:0 6px 22px rgba(31,45,90,.08)}
.g-brand{font-size:22px;font-weight:800;background:linear-gradient(90deg,#2f55d4,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-slogan{color:#6b7280;font-size:13px;margin:5px 0 14px}
.g-tabs2{display:flex;gap:8px;background:#f1f4ff;border-radius:12px;padding:5px;margin-bottom:12px}
.g-tabs2 div{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:13px;font-weight:700;color:#6b7280;cursor:pointer}
.g-tabs2 div.on{background:#fff;color:#2f55d4;box-shadow:0 2px 8px rgba(47,85,212,.12)}
.g-label{display:block;font-size:12.5px;color:#6b7280;margin:10px 0 6px}
.g-or{display:flex;align-items:center;gap:8px;margin:12px 0 6px;color:#9ca3af;font-size:12px;font-weight:600}
.g-or i{height:1px;flex:1;background:#e5e9f4;font-style:normal}
.g-input{width:100%;padding:12px;border:1px solid #e5e9f4;border-radius:12px;font-size:16px;background:#fbfcff;outline:none;box-sizing:border-box}
.g-levels{display:flex;gap:10px;margin-top:6px}
.g-lv{flex:1;text-align:center;border:1px solid #e5e9f4;border-radius:14px;padding:11px 6px;cursor:pointer;background:#fbfcff;font-weight:700;font-size:14px;color:#1b2033}
.g-lv small{display:block;font-weight:400;font-size:11px;color:#6b7280;margin-top:3px}
.g-lv.on{border-color:#9db2ff;background:#eef2ff;box-shadow:0 0 0 3px #edf1ff}
.g-btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#2f55d4,#7c3aed);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.g-btn:disabled{opacity:.45;cursor:not-allowed;background:#9aa8c7}
.g-ghost{width:100%;margin-top:9px;padding:11px;border:1px solid #e5e9f4;border-radius:12px;background:#fff;color:#2f55d4;font-size:14px;font-weight:600;cursor:pointer}
.g-msg{margin-top:10px;font-size:13px;color:#dc2626;min-height:17px}
.g-foot{margin-top:9px;color:#6b7280;font-size:11.5px;line-height:1.7}
.g-hidden{display:none}

</style>
</head>
<body>
<div id="gate">
 <div class="g-card">
  <div class="g-brand">四六级冲刺背诵</div>
  <div class="g-slogan">先选级别，再开始；不登录也能用</div>
  <label class="g-label">选择级别（必选）</label>
  <div class="g-levels">
   <div class="g-lv" data-lv="cet4" onclick="gatePick(this)">四级<small>20 天 · 2000 词 + 小测</small></div>
   <div class="g-lv" data-lv="cet6" onclick="gatePick(this)">六级<small>20 天 · 1200 词 + 小测</small></div>
  </div>
  <button class="g-btn" id="gGuest" onclick="gateGuest()" disabled>游客进入 · 不用账号</button>
  <div class="g-or"><i></i>或，用 GitHub 账号自动同步<i></i></div>
  <button class="g-btn" id="gCloud" onclick="gateCloud()" style="margin-top:0" disabled>GitHub 一键登录</button>
  <input type="hidden" id="ghToken" autocomplete="off">
  <div class="g-msg" id="gMsg"></div>
  <div class="g-foot">登录后换设备自动同步；不登录就在「同步」里生成链接。</div>
 </div>
</div>

<header>
  <div class="hbar">
    <span class="logo">四六级<b>冲刺</b>背诵</span>
    <span class="count" id="countdown"></span>
    <div class="hbtns">
      <button class="hbtn" onclick="openProfile()" title="账号与模式" style="font-size:15px">👤</button>
      <button class="hbtn" id="darkBtn" onclick="toggleDark()">🌙</button>
      <button class="hbtn" onclick="openTips()">📖 技巧</button>
      <button class="hbtn" onclick="openSync()">☁ 同步</button>
      <input type="file" id="impFile" accept="application/json" class="hidden" onchange="importProg(this)">
    </div>
  </div>
</header>

<div class="wrap">
  <div class="days" id="days"></div>
  <div class="qbanner hidden" id="qbanner">
    <span>📅 <b id="qbTitle"></b> 今日小测还没做 · <span id="qbMeta">4 题约 10 分钟</span></span>
    <button class="btn" onclick="gotoQuiz()">去作答</button>
    <button class="btn ghost" onclick="hideBanner()">稍后</button>
  </div>
  <div class="tabs" id="tabs"></div>

<script>
function ghReq(path, method, body){
  var tk=localStorage.getItem('gh_token');
  var o={method:method||'GET',headers:{'Authorization':'Bearer '+tk,'Accept':'application/vnd.github+json','Content-Type':'application/json'}};
  if(body)o.body=JSON.stringify(body);
  return fetch('https://api.github.com'+path,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||('HTTP '+r.status));return j;});});
}
var GFILE='cet-sprint.json', GDESC='CET 冲刺进度（勿删）';
function pickGist(list){
  var hits=(list||[]).filter(function(g){return g.files&&g.files[GFILE];});
  hits.sort(function(a,b){
    var sa=(a.files[GFILE].size||0),sb=(b.files[GFILE].size||0);
    if(sb!==sa)return sb-sa;
    return String(b.updated_at||'').localeCompare(String(a.updated_at||''));
  });
  return hits[0]||null;
}
function syncOk(){
  try{localStorage.setItem('sync_last',new Date().toISOString());localStorage.removeItem('sync_error');}catch(e){}
}
function syncFail(e){
  try{localStorage.setItem('sync_error',String((e&&e.message)||e||'同步失败').slice(0,180));}catch(x){}
}
function gistSaveBody(body,gid,retried){
  if(gid){
    return ghReq('/gists/'+gid,'PATCH',{files:body.files}).catch(function(e){
      if(!retried&&String((e&&e.message)||'').indexOf('404')>=0){
        localStorage.removeItem('gh_gist_id');
        return gistSaveBody(body,null,true);
      }
      throw e;
    });
  }
  return ghReq('/gists?per_page=100','GET').then(function(list){
    var hit=pickGist(list);
    if(hit){localStorage.setItem('gh_gist_id',hit.id);return ghReq('/gists/'+hit.id,'PATCH',{files:body.files});}
    return ghReq('/gists','POST',body).then(function(g){if(g&&g.id)localStorage.setItem('gh_gist_id',g.id);});
  });
}
function ghSave(level,payload){
  var all={mode:localStorage.getItem('cet_level')||'cet6',cet6:{},cet4:{}};
  try{all.cet6=JSON.parse(localStorage.getItem('cet6_progress_v1')||'{}');all.cet4=JSON.parse(localStorage.getItem('cet4_progress_v1')||'{}');}catch(e){}
  all[level]=payload;
  var body={description:GDESC,public:false,files:{}};
  body.files[GFILE]={content:JSON.stringify(all)};
  return gistSaveBody(body,localStorage.getItem('gh_gist_id'),false)
    .then(function(){syncOk();return true;})
    .catch(function(e){syncFail(e);return false;});
}
window.cloudPush=(function(){var timer=null,pending=null;
 return function(level,payload){
  if(localStorage.getItem('gh_token')){
    clearTimeout(timer);
    timer=setTimeout(function(){timer=null;ghSave(level,payload);},400);
    return;
  }
  var token=localStorage.getItem('cet_token');
  if(!token)return;
  pending={level:level,data:payload};
  clearTimeout(timer);
  timer=setTimeout(function(){
    fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(pending)}).catch(function(){});
  },1500);
 };
})();
window.cloudFlush=function(){
 if(!localStorage.getItem('gh_token'))return;
 try{var lv=window.CET_LV,fn=window.CET_PAYLOAD;if(lv&&typeof fn==='function')ghSave(lv,fn());}catch(e){}
};
window.addEventListener('pagehide',function(){try{window.cloudFlush();}catch(e){}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){try{window.cloudFlush();}catch(e){}}});

window.openProfile=function(){
 var tok=localStorage.getItem('cet_token'),gh=localStorage.getItem('gh_token');
 var guest=localStorage.getItem('guest_mode')==='1';
 var qlv=(location.search.match(/[?&]level=(cet4|cet6)/)||[])[1];var cur=qlv||localStorage.getItem('cet_level')||'cet6';
 var other=(cur==='cet4')?'六级':'四级';
 var h='<div class="section"><h2>账号与模式</h2>'
  +'<div class="qactions"><button class="btn ghost" onclick="switchLevel(\''+(other==='四级'?'cet4':'cet6')+'\')">切换到'+other+'</button>'
  +((gh||tok||guest)?'<button class="btn ghost" onclick="logout()">退出登录</button>':'<button class="btn ghost" onclick="closeProfile();showGate()">登录 GitHub</button>')
  +'</div></div>';
 document.getElementById('profileBody').innerHTML=h;
 document.getElementById('profileModal').classList.add('open');
};
window.pullCloud=async function(){
 var tk=localStorage.getItem('gh_token');
 if(!tk){alert('先登录 GitHub 账号');return;}
 var cur=(location.search.match(/[?&]level=(cet4|cet6)/)||[])[1]||localStorage.getItem('cet_level')||'cet6';
 if(!confirm('用云端进度覆盖本机的四级/六级记录？本机未上传的内容会丢失。'))return;
 try{
  var list=await gApi('/gists?per_page=100',{token:tk});
  var hit=pickGist(list);
  if(!hit){alert('云端没有找到 cet-sprint.json，先在本机背几个词并等右上角显示已同步。');return;}
  var g=await gApi('/gists/'+hit.id,{token:tk});
  var d=JSON.parse(g.files[GFILE].content)||{};
  localStorage.setItem('cet6_progress_v1',JSON.stringify(d.cet6||{}));
  localStorage.setItem('cet4_progress_v1',JSON.stringify(d.cet4||{}));
  localStorage.setItem('gh_gist_id',hit.id);syncOk();
  location.reload();
 }catch(e){
  if(authErrText(e.message)){clearAuthState();closeSync();showGate();gateMsg('登录已失效，请重新登录');}
  else alert('拉取失败：'+e.message);
 }
};
window.pushCloud=async function(){
 if(!localStorage.getItem('gh_token')){alert('先登录 GitHub 账号');return;}
 var lv=window.CET_LV,fn=window.CET_PAYLOAD;
 if(!lv||typeof fn!=='function'){alert('页面还没加载完，刷新后再试');return;}
 var ok=await ghSave(lv,fn());
 if(ok){alert('已上传到云端');}else{alert('上传失败：'+(localStorage.getItem('sync_error')||'检查网络或重新登录'));}
 openProfile();
};

window.closeProfile=function(){document.getElementById('profileModal').classList.remove('open');};
window.logout=function(){localStorage.removeItem('cet_token');localStorage.removeItem('gh_token');localStorage.removeItem('gh_gist_id');localStorage.removeItem('cet_user');localStorage.removeItem('guest_mode');localStorage.removeItem('cet_entered');localStorage.removeItem('sync_last');localStorage.removeItem('sync_error');localStorage.removeItem('gh_scope');location.href='?';};
window.switchLevel=function(lv){
 localStorage.setItem('cet_level',lv);
 if(localStorage.getItem('gh_token')){
  ghReq('/gists?per_page=100','GET').then(function(list){
   var hit=pickGist(list);
   if(!hit){location.href='?level='+lv;return;}
   localStorage.setItem('gh_gist_id',hit.id);
   return ghReq('/gists/'+hit.id,'GET').then(function(g){
    try{var d=JSON.parse(g.files[GFILE].content);localStorage.setItem('cet6_progress_v1',JSON.stringify(d.cet6||{}));localStorage.setItem('cet4_progress_v1',JSON.stringify(d.cet4||{}));}catch(e){}
    location.href='?level='+lv;
   });
  }).catch(function(){location.href='?level='+lv;});
  return;
 }
 var token=localStorage.getItem('cet_token');
 if(!token){location.href='?level='+lv;return;}
 fetch('/api/data',{headers:{'Authorization':'Bearer '+token}}).then(function(r){return r.json();}).then(function(d){
   if(d&&d.data){localStorage.setItem('cet6_progress_v1',JSON.stringify(d.data.cet6||{}));localStorage.setItem('cet4_progress_v1',JSON.stringify(d.data.cet4||{}));}
   location.href='?level='+lv;
 }).catch(function(){location.href='?level='+lv;});
};
</script>

ph":"ˌækəˈdemɪk","m":"adj. 学术的；学业的","en":"Academic pressure should not come at the cost of mental health.","cn":"学业压力不应以心理健康为代价。"},{"w":"intellectual","ph":"ˌɪntəˈlektʃuəl","m":"adj. 智力的 n. 知识分子","en":"Reading widely broadens our intellectual horizons.","cn":"广泛阅读拓宽我们的智识视野。"},{"w":"diligent","ph":"ˈdɪlɪdʒənt","m":"adj. 勤奋的","en":"Diligent practice turns knowledge into real competence.","cn":"勤奋练习把知识变成真正的能力。"},{"w":"potential","ph":"pəˈtenʃl","m":"n. 潜力 adj. 潜在的","en":"Every student has the potential to excel in a suitable field.","cn":"每个学生都有在合适领域脱颖而出的潜力。"},{"w":"excellence","ph":"ˈeksələns","m":"n. 卓越，优秀","en":"Pursuing excellence is a habit, not a single act.","cn":"追求卓越是一种习惯，而非一时之举。"},{"w":"lifelong","ph":"ˈlaɪflɒŋ","m":"adj. 终身的","en":"In a fast-changing world, lifelong learning is no longer optional.","cn":"在快速变化的世界里，终身学习不再是可选项。"}],"translation":[{"w":"the Spring Festival","ph":"","m":"春节","cn":"春节是中国最重要的传统节日，标志着农历新年的开始。","en":"The Spring Festival is the most important traditional festival in China, marking the beginning of the lunar new year.","note":"专有名词首字母大写并加 the；“标志着”用现在分词 marking 作伴随状语，是六级翻译高频句式。"},{"w":"lunar calendar","ph":"ˈluːnə(r)","m":"农历","cn":"中国传统节日大多按照农历来确定日期。","en":"Most traditional Chinese festivals are dated according to the lunar calendar.","note":"“按照”译 according to；用被动 are dated 避免生硬主语。lunar 月亮的，对照 solar 太阳的。"},{"w":"family reunion","ph":"riːˈjuːniən","m":"家庭团圆","cn":"春节是家庭团圆的时刻，人们无论多远都会赶回家。","en":"The Spring Festival is a time for family reunion, when people travel home however far away they are.","note":"“无论多远”用 however + 形容词引导让步状语；when 引导定语从句修饰 a time。"},{"w":"reunion dinner","ph":"ˈsʌmptʃuəs","m":"年夜饭","cn":"除夕夜，全家人围坐在一起享用丰盛的年夜饭。","en":"On New Year's Eve, the whole family gathers around the table to enjoy a sumptuous reunion dinner.","note":"“围坐”译 gather around the table；丰盛的 sumptuous；年夜饭固定译法 reunion dinner。"},{"w":"the Lantern Festival","ph":"ˈlæntən","m":"元宵节","cn":"元宵节在农历正月十五，人们赏花灯、吃汤圆。","en":"The Lantern Festival falls on the 15th day of the first lunar month, when people admire lanterns and eat sweet rice dumplings.","note":"节日“在某日”用 fall on；汤圆 sweet rice dumplings；正月 the first lunar month。"},{"w":"the Mid-Autumn Festival","ph":"ˈsɪmbəlaɪz","m":"中秋节","cn":"中秋节人们赏月并吃月饼，月饼象征团圆。","en":"On the Mid-Autumn Festival, people admire the full moon and eat mooncakes, which symbolize family reunion.","note":"赏月 admire the full moon；用 which 非限制性定语从句补充说明，避免碎句。"},{"w":"the Dragon Boat Festival","ph":"ˌpeɪtriˈɒtɪk","m":"端午节","cn":"端午节是为了纪念爱国诗人屈原，人们赛龙舟、吃粽子。","en":"The Dragon Boat Festival is celebrated in memory of Qu Yuan, a patriotic poet, with dragon boat races and zongzi, or sticky rice dumplings.","note":"“纪念”in memory of；文化词“粽子”用音译+解释 zongzi, or sticky rice dumplings，是标准处理方式。"},{"w":"the Double Ninth Festival","ph":"","m":"重阳节","cn":"重阳节有登高和敬老的传统。","en":"The Double Ninth Festival features the traditions of climbing mountains and respecting the elderly.","note":"“有……传统”用 feature 作动词更简洁；the elderly 表示老年人群体。"},{"w":"the Qingming Festival","ph":"ˈtrɪbjuːt","m":"清明节","cn":"清明节人们扫墓祭祖，缅怀先人。","en":"On the Qingming Festival, people sweep tombs and pay tribute to their ancestors.","note":"扫墓 sweep tombs；祭祖/缅怀 pay tribute to；祖先 ancestor。"},{"w":"pay a New Year visit","ph":"","m":"拜年","cn":"春节期间，人们走亲访友，互道新年祝福。","en":"During the Spring Festival, people visit relatives and friends and exchange New Year greetings.","note":"“走亲访友”visit relatives and friends；“互道祝福”exchange greetings，选对动词比逐字译更地道。"},{"w":"red envelope","ph":"ˈenvələʊp","m":"红包","cn":"长辈给孩子们发红包，寓意好运和祝福。","en":"Elders give children red envelopes containing lucky money, which conveys good luck and best wishes.","note":"红包 red envelope，压岁钱 lucky money；“寓意”用 convey；containing 现在分词作后置定语。"},{"w":"set off firecrackers","ph":"ˈfaɪəkrækə(r)","m":"放鞭炮","cn":"人们放鞭炮来驱赶邪气、迎接新年。","en":"People set off firecrackers to drive away evil spirits and welcome the new year.","note":"放鞭炮固定搭配 set off firecrackers；驱赶 drive away；不定式 to do 表目的。"},{"w":"spring couplets","ph":"ˈkʌplə
