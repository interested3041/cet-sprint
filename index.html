,"from":4},{"w":"reform and opening-up","ph":"","m":"改革开放","cn":"改革开放政策始于1978年。","en":"The reform and opening-up policy began in 1978.","note":"改革开放 reform and opening-up 固定译法；始于 began in。","rev":true,"from":6},{"w":"common prosperity","ph":"prɒˈsperəti","m":"共同富裕","cn":"共同富裕是中国式现代化的重要特征。","en":"Common prosperity is an important feature of Chinese modernization.","note":"共同富裕 common prosperity；中国式现代化 Chinese modernization。","rev":true,"from":6},{"w":"imports and exports","ph":"","m":"进出口","cn":"中国进出口总额居世界前列。","en":"China's total imports and exports rank among the world's highest.","note":"进出口 imports and exports；居前列 rank among。","rev":true,"from":6},{"w":"carbon neutrality","ph":"njuːˈtræləti","m":"碳中和","cn":"中国力争2060年前实现碳中和。","en":"China aims to achieve carbon neutrality by 2060.","note":"碳中和 carbon neutrality；aim to do；by 2060 到2060年。","rev":true,"from":8},{"w":"plastic restriction","ph":"","m":"限塑令","cn":"限塑令减少了白色污染。","en":"The plastic restriction policy reduces white pollution.","note":"限塑令 plastic restriction policy；白色污染 white pollution。","rev":true,"from":8},{"w":"traditional Chinese medicine","ph":"","m":"中医","cn":"中医有数千年的历史。","en":"Traditional Chinese medicine has a history of thousands of years.","note":"中医 traditional Chinese medicine；has a history of。","rev":true,"from":10},{"w":"hot pot","ph":"","m":"火锅","cn":"火锅是一种受欢迎的社交餐饮方式。","en":"Hot pot is a popular social dining experience.","note":"火锅 hot pot；社交餐饮 social dining。","rev":true,"from":10},{"w":"a community with a shared future","ph":"","m":"人类命运共同体","cn":"中国倡导构建人类命运共同体。","en":"China advocates building a community with a shared future for mankind.","note":"人类命运共同体 a community with a shared future for mankind；advocate doing。","rev":true,"from":12},{"w":"international organization","ph":"","m":"国际组织","cn":"中国在国际组织中发挥积极作用。","en":"China plays an active role in international organizations.","note":"国际组织 international organization；play a role in。","rev":true,"from":12}],"listening":[{"w":"reference","ph":"ˈrefrəns","m":"n. 参考；参考资料","en":"You can find the article in the reference section.","cn":"你可以在参考资料区找到那篇文章。","rev":true,"from":2},{"w":"overdue","ph":"ˌəʊvəˈdjuː","m":"adj. 逾期的","en":"There is a fine for overdue books.","cn":"逾期图书要交罚款。","rev":true,"from":2},{"w":"resume","ph":"ˈrezjuːmeɪ","m":"n. 简历","en":"Please send your resume to the HR department by Friday.","cn":"请在周五前把简历发到人事部。","rev":true,"from":4},{"w":"salary","ph":"ˈsæləri","m":"n. 薪水","en":"The starting salary is negotiable based on experience.","cn":"起薪可根据经验面议。","rev":true,"from":4},{"w":"reservation","ph":"ˌrezəˈveɪʃn","m":"n. 预订","en":"I'd like to make a reservation for two nights.","cn":"我想预订两晚。","rev":true,"from":6},{"w":"transfer","ph":"trænsˈfɜː(r)","m":"v./n. 换乘；转账","en":"You need to transfer to Line Three at the next station.","cn":"你需要在下一站换乘三号线。","rev":true,"from":6},{"w":"symptom","ph":"ˈsɪmptəm","m":"n. 症状","en":"What symptoms are you experiencing?","cn":"你有什么症状？","rev":true,"from":8},{"w":"dose","ph":"dəʊs","m":"n. 剂量","en":"Take one dose twice a day after meals.","cn":"每日两次，饭后服用一剂。","rev":true,"from":8},{"w":"account","ph":"əˈkaʊnt","m":"n. 账户","en":"I'd like to open a savings account.","cn":"我想开一个储蓄账户。","rev":true,"from":10},{"w":"temperature","ph":"ˈtemprətʃə(r)","m":"n. 温度","en":"The temperature will drop below zero tonight.","cn":"今晚气温将降到零度以下。","rev":true,"from":12}],"task":{"title":"复盘任务 · Day2、Day4、Day6、Day8、Day10、Day12","prompt":"本日复盘 Day2、Day4、Day6、Day8、Day10、Day12 的内容。写作：默写这些天的参考段落，并各挑3个写作词造句。翻译：遮住译文先自译再对照。听力：全程盲听。阅读：只过仍标记不认识的词。","en":"","cn":"","words":[]}}]};
window.CET6_DAILY = [{"day":1,"scope":"摸底 · 校园学习高频词（D1 当天）","listening":{"title":"第一天注册","story":"On the first day of the semester, Li Ming went to the office to register. The clerk handed him a sheet listing his assignment deadlines and reminded him that tuition must be paid before Friday. He had won a scholarship, so the burden was lighter. In the dormitory he met his roommate, who complained about the cafeteria food. That afternoon they attended a lecture given by an old professor, and Li Ming took notes until his hand ached.","q":[{"q":"What did Li Ming do first on the first day?","o":["He paid his tuition.","He registered at the office.","He met his professor.","He ate in the cafeteria."],"a":1,"why":"开头第一句 went to the office to register；tuition 是“提醒要交”，不是先交。"},{"q":"Why was his financial burden lighter?","o":["He shared a cheap dormitory.","He had won a scholarship.","He worked part-time.","His parents paid everything."],"a":1,"why":"He had won a scholarship, so the burden was lighter。"}]},"reading":{"title":"为什么第一周就放弃","passage":"Many students abandon their plans after the first week. The ones who succeed accumulate small gains every day: they keep an accurate record of what they have learned, acknowledge their weak points instead of hiding them, and set adequate goals for each session. Ambition alone is not enough; what matters is whether the daily habit is sustainable.","q":[{"q":"Who keeps making progress, according to the passage?","o":["Students who rely on ambition","Students who accumulate small gains daily","Students who study only before exams","Students who hide their weak points"],"a":1,"why":"The ones who succeed accumulate small gains every day。"},{"q":"The word acknowledge is closest in meaning to","o":["ignore","admit","deny","record"],"a":1,"why":"acknowledge = 承认（弱项），与 ignore 正相反。"}]},"translation":{"cn":"春节是中国最重要的传统节日，家人无论多远都会赶回家吃年夜饭。","ref":"The Spring Festival is the most important traditional festival in China; no matter how far away they are, family members will hurry home for the reunion dinner.","keys":["Spring Festival","traditional festival","reunion dinner","family members"],"note":"两个分句用分号连接即可；no matter how far 引导让步状语从句；“赶回家”用 hurry home，不要写成 rush back to home（home 前不加 to）。"},"writing":{"prompt":"用 cultivate、potential、lifelong 写 2 句：大学阶段最该培养的是什么？","words":["cultivate","potential","lifelong"],"ref":"University is the best time to cultivate a lifelong habit of reading, because such a habit shapes our potential far beyond the classroom.","cn":"大学是培养终身阅读习惯的最好时期，因为这种习惯对我们潜力的塑造远超课堂。","tip":"cultivate 后接 habit / ability / interest；potential 常与 realize、reach、shape 搭配；lifelong 放名词前作定语。"}},{"day":2,"scope":"检验 D1 · 教育与学习（昨天 100 词）","listening":{"title":"家长会上的课程说明","story":"At the parents meeting, the head teacher explained the new curriculum. She said the school aims to foster literacy rather than mere test scores, and to equip students with the discipline they need for academic work. One mother asked how the school would stretch every child's potential. The teacher answered that excellence grows from daily diligence, not from pressure, and that intellectual curiosity matters more than rankings.","q":[{"q":"What does the school aim to foster?","o":["Higher test scores","Literacy rather than scores alone","Stricter rules","Competitive rankings"],"a":1,"why":"foster literacy rather than mere test scores。"},{"q":"According to the teacher, excellence grows from","o":["pressure from parents","daily diligence","expensive textbooks","longer holidays"],"a":1,"why":"excellence grows from daily diligence, not from pressure。"}]},"reading":{"title":"被推着学的孩子","passage":"Some parents believe that a heavier curriculum guarantees better results. Research suggests otherwise: children learn best when they are inspired rather than pushed, when lessons connect to real life, and when teachers nurture curiosity over obedience. A literate child reads for pleasure; a trained one reads only for exams.","q":[{"q":"What is the main idea of the passage?","o":["A heavier curriculum guarantees results","Inner motivation works better than pressure","Children should obey without question","Exams are the only measure"],"a":1,"why":"首句立靶、后文反驳，全篇在讲 inspired 比 pushed 更有效。"},{"q":"The word nurture is closest in meaning to","o":["force","cultivate","ignore","test"],"a":1,"why":"nurture = 培育，与 cultivate 同义，正是 D1 的写作词。"}]},"translation":{"cn":"元宵节在正月十五，人们赏花灯、猜灯谜，还要吃元宵，象征团圆。","ref":"The Lantern Festival falls on the fifteenth day of the first lunar month, when people admire lanterns, guess lantern riddles and eat sweet dumplings, which symbolize family reunion.","keys":["Lantern Festival","lunar month","riddles","reunion"],"note":"节日日期用 falls on；“正月”是 the first lunar month，不是 January；两个 which/when 从句分别修饰时间与习俗，不要重复主语。"},"writing":{"prompt":"用 inspire、diligent、excellence 写 2 句：好老师最重要的品质是什么？","words":["inspire","diligent","excellence"],"ref":"A good teacher inspires students to ask questions and rewards diligent effort, because excellence is a habit built by daily practice rather than a gift.","cn":"好老师激发学生提问并奖励勤奋的努力，因为优秀是每日练习养成的习惯，而不是天赋。","tip":"inspire sb to do；rewards 后接 effort 比接 result 更准确；a habit built by 后接动名词短语。"}},{"day":3,"scope":"检验 D2 · 传统文化与艺术（昨天 100 词）","listening":{"title":"手工展上的两双手","story":"Last weekend our class visited a craft exhibition. A young woman demonstrated paper cutting with a pair of scissors, turning red paper into a horse in less than a minute. Nearby, an old master painted bamboo in ink wash style, saying that calligraphy and painting share the same spirit. In another hall, visitors queued to touch silk and porcelain, amazed that such delicate work was made by hand centuries ago.","q":[{"q":"What did the young woman demonstrate?","o":["Ink wash painting","Paper cutting","Porcelain making","Silk weaving"],"a":1,"why":"demonstrated paper cutting with a pair of scissors。"},{"q":"What did the old master say?","o":["Calligraphy and painting share the same spirit","Silk is more valuable than porcelain","Young people ignore tradition","Museums should sell crafts"],"a":0,"why":"saying that calligraphy and painting share the same spirit。"}]},"reading":{"title":"文化自信的真正检验","passage":"Traditional arts survive not because they are old, but because they still answer a human need. A person who learns embroidery learns patience; one who practises calligraphy learns balance. Museums that only display objects behind glass teach respect but not skill. The real test of cultural confidence is whether young people pick up the brush themselves.","q":[{"q":"The real test of cultural confidence is whether","o":["museums display more objects","young people take part themselves","the government funds more projects","tourists buy souvenirs"],"a":1,"why":"末句：whether young people pick up the brush themselves。"},{"q":"What does learning embroidery teach?","o":["speed","patience","profit","competition"],"a":1,"why":"A person who learns embroidery learns patience。"}]},"translation":{"cn":"京剧融合了唱、念、做、打，是中国传统文化的代表；许多年轻人开始重新欣赏它。","ref":"Peking Opera integrates singing, recitation, acting and acrobatic fighting, and is a representative of traditional Chinese culture; many young people are beginning to appreciate it again.","keys":["Peking Opera","traditional Chinese culture","appreciate","young people"],"note":"“唱念做打”不必逐字译，用 singing, recitation, acting, acrobatic fighting 四个名词并列；integrate 用主动语态即可。"},"writing":{"prompt":"用 traditional、appreciate、identity 写 2 句：年轻人该如何对待传统艺术？","words":["traditional","appreciate","identity"],"ref":"Young people should learn to appreciate traditional arts, because these crafts carry a cultural identity that no imported fashion can replace.","cn":"年轻人应当学会欣赏传统艺术，因为这些手艺承载着一种文化身份，是任何外来时尚都无法替代的。","tip":"appreciate 后接名词或动名词；“承载身份”用 carry an identity，比 contain 更自然。"}},{"day":4,"scope":"检验 D3 · 环境与可持续（昨天 100 词）","listening":{"title":"社区的回收计划","story":"Our community started a recycling programme last spring. Volunteers explained that sorting waste is not a burden but a habit, and that every family can cut its carbon emissions simply by using less electricity. They also warned of a coming water shortage and asked residents to preserve the local wetland. Within a year, awareness had spread to every floor, and neighbours began to treat the garden as a shared living room.","q":[{"q":"How can every family cut its carbon emissions?","o":["By buying more appliances","By using less electricity","By moving away","By stopping sorting waste"],"a":1,"why":"cut its carbon emissions simply by using less electricity。"},{"q":"What did the volunteers warn about?","o":["A coming water shortage","A rise in rent","A new tax","A flood"],"a":0,"why":"warned of a coming water shortage。"}]},"reading":{"title":"拦住绿色生活的不是技术","passage":"Green living is often sold as sacrifice, yet it is closer to common sense. A household that switches to renewable power and repairs instead of replacing keeps money at home. What blocks change is not technology but habit: people recycle when the bin is nearer than the lift, and save energy when the bill is visible.","q":[{"q":"What blocks green change, according to the passage?","o":["Technology","Habit","Money","Government"],"a":1,"why":"What blocks change is not technology but habit。"},{"q":"Renewable power refers to power from","o":["coal","sun and wind","imports","batteries"],"a":1,"why":"renewable = 可再生，对应太阳能、风能等。"}]},"translation":{"cn":"长江是中国最长的河流，流域养育了数亿人，近年来沿江省份关闭污染工厂以保护水质。","ref":"The Yangtze is China's longest river and its basin supports hundreds of millions of people; in recent years provinces along the river have closed polluting factories to protect water quality.","keys":["Yangtze","longest river","polluting factories","water quality"],"note":"“流域”用 basin，不用 area；两个分句用分号；close factories to protect 用不定式表目的。"},"writing":{"prompt":"用 preserve、awareness、harmony 写 2 句：个人能为环保做什么？","words":["preserve","awareness","harmony"],"ref":"Individuals can preserve local wetlands by using less water, and raising public awareness is the surest way to keep a balance between cities and nature.","cn":"个人可以通过少用水来保护本地湿地，而提高公众意识是保持城市与自然和谐的最可靠方式。","tip":"by + 动名词表方式；raise awareness 是固定搭配；“和谐”此处用 balance / harmony 均可，注意 keep a balance between A and B。"}},{"day":5,"scope":"检验 D4 · 历史遗产与发明（昨天 100 词）","listening":{"title":"丝路课上的地图","story":"The lecture on the Silk Road began with a map. The professor explained that silk travelled west while grapes and music came east, and that the road was less a route than a network of oases. He then showed a slide of papermaking: bark, water and patience. Someone asked why the compass mattered; he answered that a tool for finding direction changed how people imagined the sea.","q":[{"q":"What did the professor call the Silk Road?","o":["A single road","A network of oases","A Chinese invention","A modern railway"],"a":1,"why":"less a route than a network of oases（与其说是路线，不如说是绿洲网络）。"},{"q":"Why did the compass matter?","o":["It made silk cheaper","It changed how people imagined the sea","It replaced paper","It started a dynasty"],"a":1,"why":"末句：changed how people imagined the sea。"}]},"reading":{"title":"遗产不只是古迹","passage":"Heritage is not only monuments. The recipe for papermaking, the craft of printing, the habit of recording dynasties in ink: these are heritage too. Protecting a site costs money, but losing a technique costs memory. The cheapest conservation is use — a craft practised by living hands rarely dies.","q":[{"q":"What is the cheapest conservation, according to the passage?","o":["Fencing a site","Using and practising the craft","Selling relics abroad","Rebuilding from photos"],"a":1,"why":"The cheapest conservation is use。"},{"q":"What is the main idea?","o":["Monuments matter most","Techniques are heritage too","Museums should close","History is useless"],"a":1,"why":"首句即观点：遗产不只是古迹，技艺也是遗产。"}]},"translation":{"cn":"故宫是明清两代的皇宫，如今每年接待上千万游客，馆藏文物超过一百八十万件。","ref":"The Palace Museum was the imperial palace of the Ming and Qing dynasties; today it receives over ten million visitors a year and houses more than 1.8 million cultural relics.","keys":["Palace Museum","Ming and Qing","cultural relics","visitors"],"note":"“皇宫”用 imperial palace；“馆藏”用 houses（动词）比 stores 更贴切；两个分句用分号，避免从句套从句。"},"writing":{"prompt":"用 heritage、preserve、transmit 写 2 句：我们该如何把遗产交给下一代？","words":["heritage","preserve","transmit"],"ref":"We should preserve intangible heritage by teaching the craft in schools, so that it can be transmitted to the next generation rather than frozen in museums.","cn":"我们应当通过在学校教授手艺来保护非物质文化遗产，这样它才能传给下一代，而不是被冻结在博物馆里。","tip":"preserve ... by doing；so that 引导目的；transmit to 是固定搭配，rather than 后接过去分词保持平行。"}},{"day":6,"scope":"检验 D5 · 城市化与社会民生（昨天 100 词）","listening":{"title":"报告的第一个数字","story":"The report opened with a number: more than half of humanity now lives in cities. Rapid urbanisation has lifted millions out of poverty, but it has also stretched infrastructure, pushed rents up and left migrant workers outside welfare systems. The speaker argued that a city is judged not by its towers but by how it treats the cleaner who works at midnight.","q":[{"q":"What benefit of urbanisation is mentioned?","o":["Cheaper housing","Lifting millions out of poverty","Cleaner air","Shorter working hours"],"a":1,"why":"has lifted millions out of poverty。"},{"q":"How is a city judged, according to the speaker?","o":["By its towers","By its GDP","By how it treats vulnerable workers","By its population"],"a":2,"why":"not by its towers but by how it treats the cleaner who works at midnight。"}]},"reading":{"title":"包容性增长不是口号","passage":"Inclusive growth sounds like a slogan until you count the bus routes. A neighbourhood with a clinic, a school and a night bus gives a poor family a livelihood; the same family without them is one illness from collapse. Inequality is not only a gap in income; it is a gap in access.","q":[{"q":"What does the author say about inclusive growth?","o":["It is only a slogan","It is measured by access to services","It depends on towers","It means equal income"],"a":1,"why":"全篇用 clinic / school / night bus 说明“access”，末句点题。"},{"q":"The word livelihood means","o":["a way of earning a living","a city plan","a welfare office","a bus route"],"a":0,"why":"livelihood = 生计。"}]},"translation":{"cn":"中国人口老龄化加快，社区养老服务和长期护理保险正在更多城市试点。","ref":"China's population is ageing rapidly, and community care services and long-term care insurance are being piloted in more cities.","keys":["ageing","community care","long-term care insurance","piloted"],"note":"“老龄化”用 ageing（英式）或 aging；“试点”用 be piloted，被动语态更符合政策文本。"},"writing":{"prompt":"用 community、inclusive、volunteer 写 2 句：社区可以怎样帮助老人？","words":["community","inclusive","volunteer"],"ref":"A community becomes inclusive when volunteers visit elderly residents regularly, because small visits prevent the isolation that no policy can fully solve.","cn":"当志愿者定期探访老年居民时，社区才变得包容，因为这种小小的探访能防止那种任何政策都无法完全解决的孤立。","tip":"become inclusive when...；prevent 后接名词；that 从句修饰 isolation，注意不要写成 which 指人。"}},{"day":7,"scope":"检验 D6 · 健康与生活方式（昨天 100 词）","listening":{"title":"医生先问习惯","story":"The doctor did not begin with medicine. She asked how many hours I sat each day, what I ate at midnight, and whether I had walked anywhere all week. Then she explained that sedentary habits weaken immunity, that poor nutrition shows up as fatigue long before it shows up as obesity, and that ten minutes of mindfulness can lower stress more reliably than a pill.","q":[{"q":"What did the doctor ask about first?","o":["Her medicine","Her daily habits","Her family history","Her salary"],"a":1,"why":"问坐多久、半夜吃什么、一周有没有走路——都是日常习惯。"},{"q":"Ten minutes of mindfulness can","o":["cure obesity","lower stress","replace sleep","build immunity in a day"],"a":1,"why":"can lower stress more reliably than a pill。"}]},"reading":{"title":"预防比禁令便宜","passage":"Health advice fails when it is sold as a list of prohibitions. A preventive approach is cheaper and kinder: sleep at a regular hour, eat something green, move between meetings. A holistic view does not mean mysticism; it means noticing that a bad back, a short temper and a skipped breakfast are the same problem wearing different clothes.","q":[{"q":"The preventive approach is described as","o":["expensive but effective","cheaper and kinder","useless without pills","only for the young"],"a":1,"why":"A preventive approach is cheaper and kinder。"},{"q":"A holistic view here means","o":["mysticism","treating connected habits together","ignoring symptoms","taking more medicine"],"a":1,"why":"it means noticing that ... are the same problem。"}]},"translation":{"cn":"中医强调阴阳平衡，日常饮食要荤素搭配，很多中国人相信食疗胜过吃药。","ref":"Traditional Chinese medicine stresses the balance of yin and yang; a daily diet should combine meat and vegetables, and many Chinese believe that food therapy works better than medicine.","keys":["traditional Chinese medicine","yin and yang","food therapy","balance"],"note":"“荤素搭配”意译为 combine meat and vegetables，不要直译；“胜过”用 works better than，比 is better 更自然。"},"writing":{"prompt":"用 moderation、stamina、preventive 写 2 句：大学生如何避免熬夜伤身？","words":["moderation","stamina","preventive"],"ref":"Students should eat with moderation and exercise to build stamina, since preventive habits are far cheaper than treating a body that has already broken down.","cn":"学生应当饮食有节、锻炼以增强体力，因为预防性的习惯远比治疗一个已经垮掉的身体便宜。","tip":"with moderation 是固定搭配；build stamina 比 increase 更地道；since 引导原因，比 because 更书面。"}},{"day":8,"scope":"检验 D7 · 经济与发展（昨天 100 词）","listening":{"title":"季度简报","story":"The quarterly briefing was gloomy. Inflation had eaten into household consumption, investment had slowed, and two export factories had cut shifts. The official defended the subsidy scheme, arguing that support for small startups now would shorten any recession later. A journalist asked about tariffs; he replied that a disrupted supply chain hurts both ends of it.","q":[{"q":"What had inflation done?","o":["Raised wages","Eaten into household consumption","Cut exports","Increased investment"],"a":1,"why":"Inflation had eaten into household consumption。"},{"q":"What did the official defend?","o":["Higher tariffs","Subsidies for small startups","Cutting wages","Closing factories"],"a":1,"why":"defended the subsidy scheme ... support for small startups。"}]},"reading":{"title":"繁荣容易伪装成效率","passage":"A boom is easy to mistake for efficiency. When demand rises, firms expand, hire and borrow; when the cycle turns, those same choices become weight. Durable growth comes from productivity, not from cheap credit, and from institutions that let failing firms exit without taking their workers down with them.","q":[{"q":"Durable growth comes from","o":["cheap credit","productivity","higher tariffs","more debt"],"a":1,"why":"Durable growth comes from productivity, not from cheap credit。"},{"q":"When demand rises, firms tend to","o":["cut costs and wait","expand, hire and borrow","exit the market","lower prices"],"a":1,"why":"firms expand, hire and borrow。"}]},"translation":{"cn":"中国高铁运营里程居世界第一，电子商务让偏远地区的农产品也能卖到全国。","ref":"China ranks first in the world in high-speed railway mileage, and e-commerce allows farm produce from remote areas to be sold across the country.","keys":["high-speed railway","e-commerce","remote areas","across the country"],"note":"“居世界第一”用 ranks first in the world in...；allow sb/ssth to do 结构；“农产品”farm produce 不可数。"},"writing":{"prompt":"用 consumption、stimulate、investment 写 2 句：如何让经济更有韧性？","words":["consumption","stimulate","investment"],"ref":"Raising household income can stimulate consumption, while steady investment in technology makes growth less dependent on a single export market.","cn":"提高家庭收入可以刺激消费，而对技术的稳定投资则让增长不那么依赖单一出口市场。","tip":"stimulate 常接 demand / consumption / growth；less dependent on 比 not depend on 更书面；while 表对比。"}},{"day":9,"scope":"检验 D8 · 文化与多样性（昨天 100 词）","listening":{"title":"不用一颗钉子的木构","story":"At the old town, a craftsman showed us how a wooden bracket is fitted without a single nail. He said the ritual matters as much as the technique: the apprentice bows before the first cut. A designer nearby was blending traditional patterns with modern furniture, insisting that fusion is not dilution — it is translation.","q":[{"q":"How is the wooden bracket fitted?","o":["With glue","Without a single nail","With steel pins","With rope"],"a":1,"why":"fitted without a single nail。"},{"q":"The designer says fusion is","o":["dilution","translation","imitation","rejection"],"a":1,"why":"fusion is not dilution — it is translation。"}]},"reading":{"title":"身份藏在小的仪式里","passage":"Identity is carried by small rituals: the food eaten on a certain night, the song sung at a wedding, the way a bowl is held. Diversity survives when these practices are transmitted to people who did not inherit them. A museum that freezes culture preserves its shape and loses its pulse.","q":[{"q":"Identity is carried by","o":["monuments","small rituals","laws","textbooks"],"a":1,"why":"首句：Identity is carried by small rituals。"},{"q":"A museum that freezes culture","o":["keeps its shape and loses its pulse","makes it stronger","attracts more tourists","makes it universal"],"a":0,"why":"preserves its shape and loses its pulse。"}]},"translation":{"cn":"丝绸之路不仅是贸易通道，也是文明交流的桥梁。","ref":"The Silk Road was not only a trade route but also a bridge for cultural exchange between civilizations.","keys":["Silk Road","trade route","cultural exchange","bridge"],"note":"not only ... but also 连接两个表语；“文明交流”用 cultural exchange between civilizations，不必逐字译“文明”。"},"writing":{"prompt":"用 transmit、revive、identity 写 2 句：老手艺怎样活下来？","words":["transmit","revive","identity"],"ref":"Old crafts survive when masters transmit their skills to young apprentices, and when designers revive traditional patterns in products people actually use.","cn":"当师傅把技艺传给年轻学徒、设计师又在人们真正会用的产品中复兴传统纹样时，老手艺才能活下来。","tip":"transmit sth to sb；revive 后接 tradition / pattern / custom；两个 when 从句并列，注意主句放在后面更有力。"}},{"day":10,"scope":"检验 D9 · 合作与人际（昨天 100 词）","listening":{"title":"一场会拆掉的墙","story":"The two departments had fought for months over a shared budget. What finally broke the deadlock was not a compromise on numbers but a single meeting where each side described the other's pressure. Trust grew once people felt understood. They negotiated a smaller pilot, agreed to review it in six months, and discovered that a workable bond needs fewer promises and more honesty.","q":[{"q":"What broke the deadlock?","o":["A bigger budget","A meeting where each side described the other's pressure","A new manager","A vote"],"a":1,"why":"not a compromise on numbers but a single meeting where..."},{"q":"A workable bond needs","o":["more promises","fewer promises and more honesty","formal contracts","silence"],"a":1,"why":"fewer promises and more honesty。"}]},"reading":{"title":"共情不是同意","passage":"Empathy is not agreement. It is the discipline of holding another person's view long enough to see what it costs them. Teams that practise it tolerate disagreement without breaking; teams that skip it reconcile on the surface and seethe underneath. Collaboration, in the end, is a habit of repairing rather than avoiding friction.","q":[{"q":"Empathy is","o":["agreement","seeing what another's view costs them","avoiding conflict","politeness"],"a":1,"why":"It is the discipline of ... see what it costs them。"},{"q":"Teams that skip empathy","o":["argue openly","reconcile on the surface and resent underneath","work faster","trust each other"],"a":1,"why":"reconcile on the surface and seethe underneath。"}]},"translation":{"cn":"社区志愿服务让独居老人不再孤单，也增强了邻里之间的信任。","ref":"Community volunteer service keeps elderly people who live alone from feeling lonely, and it also strengthens trust among neighbours.","keys":["volunteer service","elderly people","loneliness","trust"],"note":"keep sb from doing 表示“使某人不…”；who live alone 是限制性定语从句，不能省略。"},"writing":{"prompt":"用 empathy、tolerate、bond 写 2 句：宿舍矛盾怎么化解？","words":["empathy","tolerate","bond"],"ref":"Roommates who show empathy can tolerate small differences, and that tolerance is what turns a shared room into a real bond.","cn":"愿意共情的室友能容忍小的差异，而正是这种容忍把一间合住的屋子变成了真正的纽带。","tip":"who show empathy 定语从句；that tolerance is what... 用 what 引导表语从句，强调“正是这一点”。"}},{"day":11,"scope":"检验 D10 · 媒体与信息（昨天 100 词）","listening":{"title":"一条三年前的视频","story":"The editor began with a correction. A viral video had been shared two million times before anyone checked the timestamp; it was three years old. He argued that credibility is not a reputation you own but a habit you repeat, and that platforms which reward outrage will keep producing it. A student asked who is accountable when an algorithm distorts the record.","q":[{"q":"What was wrong with the viral video?","o":["It was fake","It was three years old","It had no sound","It was too short"],"a":1,"why":"checked the timestamp; it was three years old。"},{"q":"Credibility is","o":["a reputation you own","a habit you repeat","a gift","a platform policy"],"a":1,"why":"not a reputation you own but a habit you repeat。"}]},"reading":{"title":"回声室为什么舒服","passage":"An echo chamber is comfortable because it never asks you to verify. It serves what you already believe, and each click teaches the algorithm to serve more of it. The remedy is unglamorous: read the original, check the date, name the source. Transparency is not a press release; it is showing your working.","q":[{"q":"Why is an echo chamber comfortable?","o":["It never asks you to verify","It is free","It is faster","It has more sources"],"a":0,"why":"comfortable because it never asks you to verify。"},{"q":"The remedy is","o":["more apps","original, date and source","ignoring the news","trusting friends"],"a":1,"why":"read the original, check the date, name the source。"}]},"translation":{"cn":"面对网络谣言，公众应核实信息来源，不盲目转发。","ref":"Faced with online rumours, the public should verify the source of information instead of forwarding it blindly.","keys":["online rumours","verify","source","forward"],"note":"Faced with 是分词作状语，主动形式表被动含义；instead of 后接动名词，注意 forward 不要写成 send。"},"writing":{"prompt":"用 misinformation、verify、credibility 写 2 句：怎样不被假消息带节奏？","words":["misinformation","verify","credibility"],"ref":"To avoid misinformation, we should verify a claim before sharing it, because credibility is built by small checks rather than by loud opinions.","cn":"为了避免错误信息，我们应在转发前核实一个说法，因为可信度是靠一次次小的核查建立的，而不是靠大声的观点。","tip":"To avoid 表目的；before sharing 用动名词；rather than 后接名词短语，保持平行。"}},{"day":12,"scope":"检验 D11 · 职业与工作（昨天 100 词）","listening":{"title":"开门与留门","story":"The HR manager was blunt: certificates open a door, competence keeps it open. She described a candidate who was proactive enough to ask what the team had failed at last year, and professional enough to send a thank-you note the same evening. She also warned about burnout, noting that the best juniors ask for feedback early rather than waiting for an appraisal.","q":[{"q":"According to the HR manager, what keeps the door open?","o":["Certificates","Competence","Luck","Interviews"],"a":1,"why":"certificates open a door, competence keeps it open。"},{"q":"What do the best juniors do?","o":["Wait for the appraisal","Ask for feedback early","Avoid mistakes","Change teams"],"a":1,"why":"ask for feedback early rather than waiting for an appraisal。"}]},"reading":{"title":"被看见不等于有价值","passage":"Career advice often confuses visibility with value. Networking without competence is noise; competence without visibility is a secret. The transferable skills — writing clearly, estimating time, repairing a mistake — travel further than any job title. A good mentor does not hand you answers; they shorten the loop between your attempt and reality.","q":[{"q":"Networking without competence is","o":["noise","value","a shortcut","a career"],"a":0,"why":"Networking without competence is noise。"},{"q":"A good mentor does what?","o":["gives answers","shortens the loop between attempt and reality","sets deadlines","writes reports"],"a":1,"why":"does not hand you answers; they shorten the loop..."}]},"translation":{"cn":"苏州园林以精巧的布局著称，借景与对景让有限的空间显得深远。","ref":"Suzhou gardens are known for their exquisite layout; borrowed scenery and framed views make a limited space seem profound.","keys":["Suzhou gardens","layout","borrowed scenery","limited space"],"note":"be known for 是固定搭配；“借景”译 borrowed scenery，“对景”可作 framed views；两个分句用分号连接。"},"writing":{"prompt":"用 proactive、feedback、competence 写 2 句：实习生怎样快速成长？","words":["proactive","feedback","competence"],"ref":"An intern grows fastest by being proactive about asking for feedback, since honest comments turn daily tasks into real competence.","cn":"实习生成长最快的方式是主动寻求反馈，因为诚实的意见能把日常任务变成真正的能力。","tip":"be proactive about doing；since 引导原因；turn A into B 是常见搭配。"}},{"day":13,"scope":"复盘 D1–D2 · 校园与教育","listening":{"title":"考试周的图书馆","story":"The library closes at eleven, but the reading room stays open all night during exams. Students reserve seats online, renew books from their phones, and race the clock against overdue fines. One librarian says the real skill is not finding a database but knowing which question to ask it.","q":[{"q":"What stays open all night during exams?","o":["The cafeteria","The reading room","The gym","The lab"],"a":1,"why":"the reading room stays open all night during exams。"},{"q":"The real skill, according to the librarian, is","o":["finding a database","knowing which question to ask","arriving early","buying books"],"a":1,"why":"not finding a database but knowing which question to ask it。"}]},"reading":{"title":"把讲座当问题，不当笔记","passage":"A curriculum that rewards memory alone produces students who are accurate and helpless. The ones who flourish treat every lecture as a question, not a transcript: they test ideas against evidence, argue with the textbook, and revise their notes until the structure is their own.","q":[{"q":"Students who flourish treat a lecture as","o":["a transcript","a question","a holiday","a test"],"a":1,"why":"treat every lecture as a question, not a transcript。"},{"q":"What is the main idea?","o":["Memory is enough","Active inquiry beats memorising","Notes should be copied","Textbooks are always wrong"],"a":1,"why":"全篇对比“只奖励记忆”与“主动质疑”，结论是后者更有效。"}]},"translation":{"cn":"中秋节人们赏月、吃月饼，寄托对家人的思念。","ref":"During the Mid-Autumn Festival people admire the moon and eat mooncakes, expressing their longing for family.","keys":["Mid-Autumn Festival","mooncakes","admire the moon","longing for family"],"note":"现在分词 expressing 作伴随状语；“寄托思念”意译为 expressing longing for，不必逐字。"},"writing":{"prompt":"用 curiosity、discipline、potential 写 2 句：什么样的学习习惯最有效？","words":["curiosity","discipline","potential"],"ref":"Curiosity decides what you explore, discipline decides how far you go, and together they turn raw potential into real ability.","cn":"好奇心决定你探索什么，自律决定你走多远，二者共同把原始潜力变成真正的能力。","tip":"三个并列主语用逗号与 and 连接；turn A into B；raw potential 是常见搭配。"}},{"day":14,"scope":"复盘 D3–D4 · 传统艺术与可持续","listening":{"title":"用废料办的展","story":"The exhibition was built from waste. A designer had turned discarded fishing nets into a hanging garden, and a potter had fired broken tiles into new vases. The label explained that craft is a form of recycling: nothing is thrown away until someone decides it has no use.","q":[{"q":"What did the designer turn used nets into?","o":["A hanging garden","A boat","A dress","A lamp"],"a":0,"why":"turned discarded fishing nets into a hanging garden。"},{"q":"Craft is described as","o":["a luxury","a form of recycling","a hobby","a business"],"a":1,"why":"craft is a form of recycling。"}]},"reading":{"title":"博物馆开始算碳","passage":"Museums are beginning to count carbon. Shipping a fragile porcelain vase across an ocean costs more than displaying a local embroidery, and visitors notice. The greenest exhibition may be the one that borrows less, travels shorter and explains more.","q":[{"q":"What are museums beginning to count?","o":["Visitors","Carbon","Profits","Staff"],"a":1,"why":"Museums are beginning to count carbon。"},{"q":"The greenest exhibition is the one that","o":["travels less and explains more","borrows more","ships more","charges more"],"a":0,"why":"borrows less, travels shorter and explains more。"}]},"translation":{"cn":"大运河沟通南北，促进了沿线城市的繁荣。","ref":"The Grand Canal linked the north and the south, promoting the prosperity of cities along its banks.","keys":["Grand Canal","north and the south","prosperity","cities along"],"note":"现在分词 promoting 作结果状语；“沿线”用 along its banks / along the route。"},"writing":{"prompt":"用 sustainable、preserve、awareness 写 2 句：一次展览能怎样影响观众？","words":["sustainable","preserve","awareness"],"ref":"An exhibition built from waste can raise awareness of sustainable design, because visitors see that preserving materials is also a form of art.","cn":"一场用废料搭建的展览能提升人们对可持续设计的意识，因为观众看到保存材料本身也是一种艺术。","tip":"raise awareness of；built from waste 是过去分词短语作后置定语；that 从句作 see 的宾语。"}},{"day":15,"scope":"复盘 D5–D6 · 历史遗产与城市民生","listening":{"title":"老厂房里的讲解员","story":"The old factory is now a museum. Machines stand where workers once stood, and a retired engineer gives tours on Saturdays. He says the building was saved not for tourists but for the neighbourhood, because a place that remembers its labour teaches children that cities are made by hands.","q":[{"q":"Who gives tours on Saturdays?","o":["A tour guide","A retired engineer","A student","A manager"],"a":1,"why":"a retired engineer gives tours on Saturdays。"},{"q":"Why was the building saved?","o":["For tourists","For the neighbourhood","For the government","For a film"],"a":1,"why":"not for tourists but for the neighbourhood。"}]},"reading":{"title":"城市更新的真检验","passage":"Urban renewal usually means demolition with a press release. A cheaper and better test is whether the same residents can still afford to live there after the project. When rents double and the bakery closes, a district has gained a skyline and lost a livelihood.","q":[{"q":"A better test of urban renewal is","o":["a taller skyline","whether residents can still afford to live there","more shops","wider roads"],"a":1,"why":"whether the same residents can still afford to live there。"},{"q":"A district with a new skyline and a closed bakery has","o":["gained a livelihood","lost a livelihood","gained residents","improved welfare"],"a":1,"why":"gained a skyline and lost a livelihood。"}]},"translation":{"cn":"一带一路倡议推动了沿线国家的基础设施建设与贸易往来。","ref":"The Belt and Road Initiative has promoted infrastructure construction and trade among countries along the routes.","keys":["Belt and Road","infrastructure","trade","countries along"],"note":"“一带一路”固定译法 the Belt and Road Initiative；“沿线国家”用 countries along the routes。"},"writing":{"prompt":"用 community、livelihood、inclusive 写 2 句：老城区改造应注意什么？","words":["community","livelihood","inclusive"],"ref":"Renovation should protect the livelihood of the original community; otherwise the project may look inclusive on paper while pushing residents out.","cn":"改造应保护原有社区的生计，否则项目纸面上看似包容，实际却把居民挤走。","tip":"otherwise 引导相反后果；on paper 与 push out 形成对比；句子用分号连接更利落。"}},{"day":16,"scope":"复盘 D7–D8 · 健康与经济","listening":{"title":"把疲劳当成了投入","story":"The startup began with two people and a spreadsheet. Growth came fast, and so did the cost: twelve-hour days, skipped meals, and a founder who mistook fatigue for commitment. A doctor's warning forced a change. They hired earlier, slept more, and discovered that a sustainable pace beat a heroic sprint.","q":[{"q":"What did the founder mistake fatigue for?","o":["Success","Commitment","Illness","Luck"],"a":1,"why":"a founder who mistook fatigue for commitment。"},{"q":"What beat a heroic sprint?","o":["A bigger team","A sustainable pace","More funding","A new office"],"a":1,"why":"a sustainable pace beat a heroic sprint。"}]},"reading":{"title":"廉价信贷会美化一切计划","passage":"Cheap credit flatters every business plan. It hides inefficiency, rewards expansion for its own sake, and turns a temporary boom into a permanent cost. The discipline that survives a recession is dull: know your unit economics, keep cash, and say no to growth you cannot fund.","q":[{"q":"Cheap credit does what?","o":["Improves quality","Hides inefficiency and rewards expansion","Cuts costs","Raises productivity"],"a":1,"why":"It hides inefficiency, rewards expansion for its own sake。"},{"q":"The discipline that survives a recession is","o":["grow at any cost","know unit economics and keep cash","borrow more","hire fast"],"a":1,"why":"know your unit economics, keep cash, and say no to growth you cannot fund。"}]},"translation":{"cn":"中国新能源汽车产销量连续多年全球第一，充电桩网络迅速扩展。","ref":"China has ranked first in the world for several years in the production and sales of new energy vehicles, and its charging network is expanding rapidly.","keys":["new energy vehicles","production and sales","charging network","ranks first"],"note":"“产销量”用 production and sales，两个名词并列；“连续多年”用 for several years 置于句中。"},"writing":{"prompt":"用 efficiency、sustainable、investment 写 2 句：技术投入与可持续增长的关系？","words":["efficiency","sustainable","investment"],"ref":"Investment in technology raises efficiency, and higher efficiency is what makes long-term growth sustainable rather than a short-lived boom.","cn":"对技术的投资提高效率，而更高的效率才使长期增长可持续，而不是昙花一现的繁荣。","tip":"Investment in；what makes ... sustainable 用 what 引导表语从句；rather than 后接名词，保持平行。"}},{"day":17,"scope":"复盘 D9–D10 · 人际与信息","listening":{"title":"一条被转发的消息","story":"The family argument started over a forwarded message. Nobody had read past the headline. The grandmother, who had once worked at a newspaper, asked a simple question: who says so? The room went quiet. They looked it up together, found the story was four years old, and laughed at how quickly they had believed it.","q":[{"q":"What started the argument?","o":["A phone call","A forwarded message","A newspaper","A television report"],"a":1,"why":"started over a forwarded message。"},{"q":"The grandmother's question was","o":["Who wrote this?","Who says so?","Why forward it?","When was it published?"],"a":1,"why":"asked a simple question: who says so?"}]},"reading":{"title":"谣言为什么跑得快","passage":"Rumours travel because they are useful: they explain a fear, name a villain, or confirm a suspicion. Checking them is therefore not only a media skill but a social one. A friend who asks for the source before forwarding is doing more for trust than a hundred slogans about harmony.","q":[{"q":"Rumours travel because they are","o":["true","useful","cheap","rare"],"a":1,"why":"they are useful: they explain a fear..."},{"q":"Checking sources is","o":["only a media skill","a social skill too","a waste of time","a government duty"],"a":1,"why":"not only a media skill but a social one。"}]},"translation":{"cn":"火锅源于重庆码头，如今成为中国最受欢迎的餐饮之一。","ref":"Hot pot originated in the docks of Chongqing and has now become one of the most popular kinds of food in China.","keys":["hot pot","originated","Chongqing","popular"],"note":"originate in 表示起源于某地；现在完成时 has become 强调结果延续到现在。"},"writing":{"prompt":"用 verify、trust、tolerate 写 2 句：家庭群里如何讨论争议话题？","words":["verify","trust","tolerate"],"ref":"In a family chat, we should verify a claim before arguing about it, and tolerate different views so that trust survives the disagreement.","cn":"在家庭群里，我们应在争论前先核实一个说法，并容忍不同观点，这样信任才能在分歧中存活下来。","tip":"before arguing 用动名词；so that 引导目的；trust survives the disagreement 主谓一致。"}},{"day":18,"scope":"复盘 D11–D12 · 职业与对外交流","listening":{"title":"面试里那个问题","story":"The interview lasted forty minutes and turned on one question: tell me about a failure. The candidate described a project she had mismanaged, what she had learned, and what she had changed afterwards. The panel hired her, not because she had no weaknesses, but because she could name them without flinching.","q":[{"q":"Which question decided the interview?","o":["Why do you want this job?","Tell me about a failure.","What is your salary expectation?","Where do you live?"],"a":1,"why":"turned on one question: tell me about a failure。"},{"q":"Why did the panel hire her?","o":["She had no weaknesses","She could name her weaknesses without flinching","She knew the manager","She had a certificate"],"a":1,"why":"not because she had no weaknesses, but because she could name them without flinching。"}]},"reading":{"title":"交换的回报很慢","passage":"International exchange is often measured in photographs. The real return is slower: a student who has argued with a classmate from another country learns that disagreement need not be hostility, and that her own assumptions were one option among several.","q":[{"q":"The real return of exchange is","o":["photographs","a slower change in assumptions","a certificate","a scholarship"],"a":1,"why":"The real return is slower: ... her own assumptions were one option among several。"},{"q":"The student learns that disagreement need not be","o":["hostility","silence","agreement","politeness"],"a":0,"why":"disagreement need not be hostility。"}]},"translation":{"cn":"孔子学院致力于推广汉语教学，促进中外文明互鉴。","ref":"Confucius Institutes are devoted to promoting Chinese language teaching and to enhancing mutual learning between Chinese and other civilizations.","keys":["Confucius Institute","Chinese language","mutual learning","civilizations"],"note":"be devoted to doing 中 to 是介词，后接动名词；“互鉴”用 mutual learning，比 learn from each other 更书面。"},"writing":{"prompt":"用 proactive、professionalism、competence 写 2 句：新人如何在团队里建立信任？","words":["proactive","professionalism","competence"],"ref":"A newcomer earns trust by being proactive about small tasks and by showing professionalism in every deadline, since competence is proved rather than claimed.","cn":"新人通过主动承担小事、在每个截止期上体现专业精神来赢得信任，因为能力是被证明的，不是被声明的。","tip":"earn trust by doing；in every deadline 表范围；rather than claimed 与 proved 保持被动平行。"}},{"day":19,"scope":"复盘 D1/D3/D5/D7/D9/D11 · 混合冲刺","listening":{"title":"考试周的三条通知","story":"The notice board announced three changes for exam week: the cafeteria would open an hour earlier, the gym would close, and the shuttle bus would run every twenty minutes. A student beside me muttered that the only thing unchanged was the deadline. We laughed, then went to the library to reserve a seat.","q":[{"q":"How often would the shuttle bus run?","o":["Every ten minutes","Every twenty minutes","Every hour","Not at all"],"a":1,"why":"the shuttle bus would run every twenty minutes。"},{"q":"What was unchanged?","o":["The cafeteria","The gym","The deadline","The bus"],"a":2,"why":"the only thing unchanged was the deadline。"}]},"reading":{"title":"只算工资的大学","passage":"A university that measures only its graduates' salaries will quietly abandon the subjects that cannot be priced. Yet the courses that teach a student to read a river, to argue with a statistic and to sit with an unanswered question are exactly the ones a society needs when the crisis arrives.","q":[{"q":"What risk does the author point to?","o":["Too many students","Abandoning subjects that cannot be priced","Higher salaries","Shorter courses"],"a":1,"why":"will quietly abandon the subjects that cannot be priced。"},{"q":"The courses described are valuable because","o":["they are cheap","they prepare students for crises","they are popular","they raise salaries"],"a":1,"why":"exactly the ones a society needs when the crisis arrives。"}]},"translation":{"cn":"端午节源于纪念屈原，人们赛龙舟、吃粽子；长江流域的许多城市都会举行龙舟赛。","ref":"The Dragon Boat Festival originated as a memorial to Qu Yuan; people hold dragon boat races and eat zongzi, and many cities along the Yangtze hold races as well.","keys":["Dragon Boat Festival","Qu Yuan","dragon boat races","zongzi"],"note":"originate as a memorial to 表示“源于纪念”；两个分句用分号；as well 放句末避免重复谓语。"},"writing":{"prompt":"用 innovation、efficiency、transform 写 2 句：技术如何改变一个行业？","words":["innovation","efficiency","transform"],"ref":"Innovation does not simply raise efficiency; it can transform an industry by changing what customers expect as normal.","cn":"创新不只是提高效率，它还能通过改变顾客对“正常”的期待来改造一个行业。","tip":"not simply ... but can ... 结构；by changing 表方式；what customers expect 是名词性从句作 changing 的宾语。"}},{"day":20,"scope":"考前最后一套 · 全范围混合","listening":{"title":"最后一课的那个问题","story":"At the end of the term, the professor gave no summary. She asked one question: what will you do differently tomorrow? A student said she would stop rereading notes and start testing herself. Another said he would sleep before an exam instead of memorising all night. The professor nodded and said that habits, not intentions, decide results.","q":[{"q":"What did the first student decide to change?","o":["Reread notes more","Start testing herself","Study all night","Skip the exam"],"a":1,"why":"stop rereading notes and start testing herself。"},{"q":"What decides results, according to the professor?","o":["Intentions","Habits","Talent","Luck"],"a":1,"why":"habits, not intentions, decide results。"}]},"reading":{"title":"二十天能改变什么","passage":"Twenty days is short enough to feel urgent and long enough to change a habit. The plan that works is not the most ambitious one but the one you can repeat on a bad day: ten minutes of listening in the morning, thirty words at noon, one paragraph at night. Consistency, not intensity, is what survives.","q":[{"q":"Which plan works, according to the passage?","o":["The most ambitious one","The one you can repeat on a bad day","The one with most words","The one with longest sessions"],"a":1,"why":"not the most ambitious one but the one you can repeat on a bad day。"},{"q":"What survives?","o":["Intensity","Consistency","Luck","Talent"],"a":1,"why":"Consistency, not intensity, is what survives。"}]},"translation":{"cn":"考试前的最后一周，保持规律作息比熬夜刷题更重要。","ref":"In the last week before the exam, keeping a regular routine matters more than staying up late doing exercises.","keys":["last week","regular routine","staying up late","matters more"],"note":"keeping a regular routine 作主语，谓语用单数 matters；比较结构 more than 后接动名词，保持平行。"},"writing":{"prompt":"用 perseverance、mindset、commitment 写 2 句：考前最后两天你会怎么安排？","words":["perseverance","mindset","commitment"],"ref":"In the last two days I will review only what I have marked wrong; perseverance matters, but a calm mindset and a clear commitment to sleep matter just as much.","cn":"最后两天我只复习标记为错的词；毅力当然重要，但平稳的心态和对睡眠的明确承诺同样重要。","tip":"what I have marked wrong 是名词性从句；matter just as much 表示“同样重要”；分号连接两个并列观点。"}}];
</script>
<script>
(function(){
"use strict";
var LV = (function(){var q=(location.search.match(/[?&]level=(cet4|cet6)/)||[])[1];if(q)return q;return localStorage.getItem('cet_level')==='cet4'?'cet4':'cet6';})();
var D = (LV==='cet4' && window.CET4_DATA) ? window.CET4_DATA : window.CET6_DATA;
if(!D){document.getElementById('cards').innerHTML='<div class="empty">数据未加载，请运行 build.ps1 生成。</div>';return;}
var META=D.meta, DAYS=D.days;
var LVN=META.level||(LV==='cet4'?'四级':'六级');
var CATS=[
  {k:'reading',n:'阅读',c:60,color:'var(--read)'},
  {k:'writing',n:'写作',c:15,color:'var(--write)'},
  {k:'translation',n:'翻译',c:15,color:'var(--trans)'},
  {k:'listening',n:'听力',c:10,color:'var(--listen)'}
].filter(function(c){return DAYS.some(function(d){return d[c.k]&&d[c.k].length;});});
var STORE=(LV==='cet4'?'cet4_progress_v1':'cet6_progress_v1');
var state={day:0,cat:'reading',test:false,shuffle:false,unknown:false,marks:{},revealed:{},daily:{},sched:{},bannerOff:'',errFilter:'all',errQuery:''};

function load(){try{var s=JSON.parse(localStorage.getItem(STORE));if(s&&s.marks)state.marks=s.marks;if(s&&s.daily)state.daily=s.daily;if(s&&s.sched)state.sched=s.sched;state.bannerOff=localStorage.getItem('cet6_banner_v1')||'';}catch(e){}}
function payload(){return {marks:state.marks,daily:state.daily,sched:state.sched};}
window.CET_PAYLOAD=payload;window.CET_LV=LV;
function save(){try{localStorage.setItem(STORE,JSON.stringify(payload()));}catch(e){}try{if(window.cloudPush)window.cloudPush(LV,payload());}catch(e){}}
var REV=[1,2,4,7,15];
function addDays(n){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(a,b){return Math.round((new Date(String(a).replace(/-/g,'/'))-new Date(String(b).replace(/-/g,'/')))/86400000);}
function ensureSched(k,stage){var x=state.sched[k];if(!x){x={s:stage||0,due:todayStr(),n:0};state.sched[k]=x;}return x;}
function advanceSched(k){var x=ensureSched(k,0),st=(x.s||0)+1;x.n=(x.n||0)+1;if(st>REV.length){delete state.sched[k];return true;}x.s=st;x.due=addDays(REV[st-1]);return false;}
function dueText(due){var d=dayDiff(due,todayStr());if(d<0)return '逾期'+(-d)+'天';if(d===0)return '今天该复习';return d+'天后（'+String(due).slice(5)+'）';}
function initSched(){var k;for(k in state.marks){if(state.marks[k]===0&&!state.sched[k])state.sched[k]={s:0,due:todayStr(),n:0};else if(state.marks[k]===1&&state.sched[k])delete state.sched[k];}}

function key(cat,w){return cat+':'+String(w).toLowerCase();}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- 音频 ---------- */
var audioNow=null;
var SCROLL={};
function stopAudio(){
  try{if(audioNow){audioNow.pause();audioNow=null;}}catch(e){}
  try{if('speechSynthesis' in window)window.speechSynthesis.cancel();}catch(e){}
}
function tts(text,rate){
  if(!('speechSynthesis' in window))return;
  try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||0.9;window.speechSynthesis.speak(u);}catch(e){}
}
function ttsUrl(kind,t){
  if(kind==='youdao')return 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(t)+'&type=1';
  if(kind==='baidu')return 'https://fanyi.baidu.com/gettts?lan=en&text='+encodeURIComponent(t)+'&spd=3&source=web';
  return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q='+encodeURIComponent(t);
}
function tryPlay(urls,text,rate){
  stopAudio();
  var i=0;
  function next(){
    if(i>=urls.length){tts(text,rate);return;}
    var a;
    try{a=new Audio(urls[i++]);}catch(e){tts(text,rate);return;}
    audioNow=a;
    if(rate&&rate!==1){try{a.playbackRate=rate;}catch(e){}}
    var moved=false;
    function fail(){if(moved)return;moved=true;try{a.pause();}catch(e){}next();}
    a.onerror=fail;
    var p=a.play();
    if(p&&p.catch)p.catch(fail);
    setTimeout(function(){if(!moved&&a.readyState<2&&a.paused)fail();},5000);
  }
  next();
}
function speak(text){if(!text)return;tryPlay([ttsUrl('youdao',text),ttsUrl('baidu',text),ttsUrl('google',text)],text);}
function speakSentence(text,rate){if(!text)return;tryPlay([ttsUrl('baidu',text),ttsUrl('google',text)],text,rate||1);}
window.speak=speak;window.speakSentence=speakSentence;

/* ---------- 倒计时 & 天数 ---------- */
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function initCountdown(){
  var exam=new Date(META.examDate.replace(/-/g,'/')+' 00:00:00');
  var now=new Date(); now.setHours(0,0,0,0);
  var days=Math.round((exam-now)/86400000);
  var el=document.getElementById('countdown');
  if(days>0)el.innerHTML='距'+LVN+'笔试 <b>'+days+'</b> 天';
  else if(days===0)el.innerHTML='<b>今天</b>考试，加油！';
  else el.innerHTML='考试已结束';
}
function pickToday(){
  var t=todayStr();
  for(var i=0;i<DAYS.length;i++){if(DAYS[i].date===t)return i;}
  if(t<DAYS[0].date)return 0;
  return DAYS.length-1;
}
function renderDays(){
  var t=todayStr(),h='';
  DAYS.forEach(function(d,i){
    var cls='daychip'+(i===state.day?' active':'')+(d.date===t?' today':'');
    var tag=d.type==='new'?'<span class="tag new">新</span>':'<span class="tag rev">复</span>';
    var md=d.date.slice(5).replace('-','/');
    h+='<div class="'+cls+'" onclick="goDay('+i+')"><div class="dn">D'+d.day+'</div><div class="dd">'+md+'</div>'+tag+'</div>';
  });
  document.getElementById('days').innerHTML=h;
  var act=document.querySelector('.daychip.active');
  if(act)act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
window.goDay=function(i){if(i===state.day)return;SCROLL[state.day+':'+state.cat]=window.scrollY||0;state.day=i;state.revealed={};renderDays();renderTabs();renderTip();renderCards();renderTask();updateProg();window.scrollTo(0,SCROLL[i+':'+state.cat]||0);};

/* ---------- tabs ---------- */
function renderTabs(){
  var d=DAYS[state.day],h='';
  CATS.forEach(function(c){
    var n=d[c.k].length;
    h+='<div class="tab'+(state.cat===c.k?' active':'')+'" data-c="'+c.k+'" onclick="goCat(\''+c.k+'\')">'+c.n+'<small>'+n+'词</small></div>';
  });
  if(dailyArr().length)h+='<div class="tab'+(state.cat==='quiz'?' active':'')+'" data-c="quiz" onclick="goCat(\'quiz\')">小测<small>每日1套</small></div>';
  else if(state.cat==='quiz')state.cat='reading';
  h+='<div class="tab'+(state.cat==='errbook'?' active':'')+'" data-c="errbook" onclick="goCat(\'errbook\')">错词<small>自动收集</small></div>';
  document.getElementById('tabs').innerHTML=h;
}

function tok(s){return String(s).toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean);}
window.toggleDict=function(id){var el=document.getElementById(id);if(el)el.classList.toggle('hidden');};
window.checkDict=function(id,expected){
  var ta=document.getElementById('ta_'+id);if(!ta)return;
  var e=tok(expected),a=tok(ta.value);
  var m=e.length,n=a.length;
  var dp=[];for(var i=0;i<=m;i++){dp[i]=[];for(var j=0;j<=n;j++)dp[i][j]=0;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)dp[i][j]=e[i-1]===a[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  var ei=m,aj=n,ematch=[],amatch=[];
  for(i=0;i<m;i++)ematch[i]=false;for(j=0;j<n;j++)amatch[j]=false;
  while(ei>0&&aj>0){
    if(e[ei-1]===a[aj-1]){ematch[ei-1]=true;amatch[aj-1]=true;ei--;aj--;}
    else if(dp[ei-1][aj]>=dp[ei][aj-1])ei--;else aj--;
  }
  var matched=ematch.filter(Boolean).length;
  var pct=m?Math.round(matched/m*100):0;
  var eh=e.map(function(w,i){return '<span class="'+(ematch[i]?'ok':'miss')+'">'+esc(w)+'</span>';}).join(' ');
  var ah=a.map(function(w,j){return '<span class="'+(amatch[j]?'ok':'extra')+'">'+esc(w)+'</span>';}).join(' ');
  document.getElementById('sc_'+id).innerHTML='得分 <b style="color:'+(pct>=80?'var(--ok)':pct>=50?'var(--warn)':'var(--no)')+'">'+pct+'%</b> ('+matched+'/'+m+')';
  document.getElementById('df_'+id).innerHTML='<span class="lab">参考（红=漏写）：</span>'+eh+'<span class="lab">你的（橙=多写/错写）：</span>'+(ah||'（空）');
};

      var k;
      for(k=0;k<pool.length&&opts.length<4;k++){var c=pool[k];if(c.w===it.w)continue;if(!meanClash(it.m,c.m))opts.push(c.w);}
      for(k=0;k<pool.length&&opts.length<4;k++){var c2=pool[k];if(c2.w!==it.w&&opts.indexOf(c2.w)<0)opts.push(c2.w);}

function gradeOf(q,a){
  var lOK=0,rOK=0,tOK=0,wOK=0,i;
  q.listening.q.forEach(function(it,i){if(a.l&&a.l[i]===it.a)lOK++;});
  q.reading.q.forEach(function(it,i){if(a.r&&a.r[i]===it.a)rOK++;});
  q.translation.keys.forEach(function(k){if(keyHit(a.t,k))tOK++;});
  q.writing.words.forEach(function(k){if(wordHit(a.w,k))wOK++;});
  var total=q.listening.q.length+q.reading.q.length+q.translation.keys.length+q.writing.words.length;
  var got=lOK+rOK+tOK+wOK;
  return {l:lOK,r:rOK,t:tOK,w:wOK,got:got,total:total,pct:total?Math.round(got/total*100):0};
}

  return '<div class="qwhy">'+(sel===it.a?'✅ 正确':'❌ 正确答案 '+letter(it.a))+'　'+esc(it.why)+'</div>';

function transResult(T,ans){
  var g=T.keys.map(function(k){return '<span class="'+(keyHit(ans,k)?'ok':'no')+'">'+esc(k)+'</span>';}).join('、');
  return '<div class="qres">关键词命中：'+g+'</div><div class="qref"><span class="lab">参考译文</span>'+esc(T.ref)+'</div><div class="qwhy">💡 '+esc(T.note)+'</div>';
}
function writeResult(W,ans){
  var ws=W.words.map(function(w){return '<span class="chipw'+(wordHit(ans,w)?' on':'')+'">'+esc(w)+'</span>';}).join('');
  var wc=(String(ans||'').trim().match(/[A-Za-z][A-Za-z'-]*/g)||[]).length;
  return '<div class="qres">用词覆盖：'+ws+' · 词数 '+wc+(wc<25?' <span class="no">偏少，建议 25 词以上</span>':'')+'</div>'
    +'<div class="qref"><span class="lab">参考段落</span>'+esc(W.ref)+'<span class="lab" style="margin-top:6px">译文</span>'+esc(W.cn)+'</div>'
    +'<div class="qwhy">💡 '+esc(W.tip)+'</div>';
}


function gradeOf4(q,a){
  var v=0,t=0,i;
  q.vocab.forEach(function(it,i){if(a.v&&a.v[i]===it.a)v++;});
  q.translation.keys.forEach(function(k){if(keyHit(a.t,k))t++;});
  var total=q.vocab.length+q.translation.keys.length,got=v+t;
  return {v:v,t:t,got:got,total:total,pct:total?Math.round(got/total*100):0};
}
function scoreHtml4(q,a){
  var g=gradeOf4(q,a),col=g.pct>=80?'#065f46':g.pct>=50?'#92400e':'#991b1b';
  return '<div class="qscore">本次 <b style="color:'+col+'">'+g.pct+'%</b>（'+g.got+'/'+g.total+'） · 词汇 '+g.v+'/'+q.vocab.length+' · 翻译 '+g.t+'/'+q.translation.keys.length+'</div>';
}

var CATNAME={reading:'阅读',writing:'写作',translation:'翻译',listening:'听力'};
function wrongWords(){
  var out=[];
  DAYS.forEach(function(d){
    ['reading','writing','translation','listening'].forEach(function(c){
      d[c].forEach(function(it){
        var k=key(c,it.w);
        if(state.marks[k]===0)out.push({cat:c,it:it,day:d.day,date:d.date,sched:ensureSched(k,0)});
      });
    });
  });
  out.sort(function(a,b){if(a.sched.due!==b.sched.due)return a.sched.due<b.sched.due?-1:1;return a.day-b.day;});
  return out;
}
function quizErrors(){
  var out=[],dk;
  for(dk in state.daily){
    var a=state.daily[dk];
    if(!a||!a.submitted)continue;
    var q=findQuiz(parseInt(dk,10));
    if(!q)continue;
    if(q.kind==='cet4'){
      q.vocab.forEach(function(it,i){
        var pick=a.v?a.v[i]:null;
        if(pick!==it.a)out.push({day:q.day,label:'词汇 Q'+(i+1),stem:it.q,mine:pick==null?'未选':letter(pick)+'. '+it.o[pick],right:letter(it.a)+'. '+it.o[it.a],why:it.why});
      });
      q.translation.keys.forEach(function(k){
        if(!keyHit(a.t,k))out.push({day:q.day,label:'翻译缺词',stem:k,mine:'没写到',right:k,why:q.translation.note});
      });
      continue;
    }
    q.listening.q.forEach(function(it,i){
      var pick=a.l?a.l[i]:null;
      if(pick!==it.a)out.push({day:q.day,label:'听力 Q'+(i+1),stem:it.q,mine:pick==null?'未选':letter(pick)+'. '+it.o[pick],right:letter(it.a)+'. '+it.o[it.a],why:it.why});
    });
    q.reading.q.forEach(function(it,i){
      var pick=a.r?a.r[i]:null;
      if(pick!==it.a)out.push({day:q.day,label:'阅读 Q'+(i+1),stem:it.q,mine:pick==null?'未选':letter(pick)+'. '+it.o[pick],right:letter(it.a)+'. '+it.o[it.a],why:it.why});
    });
    q.translation.keys.forEach(function(k){
      if(!keyHit(a.t,k))out.push({day:q.day,label:'翻译缺词',stem:k,mine:'没写到',right:k,why:q.translation.note});
    });
    q.writing.words.forEach(function(w){
      if(!wordHit(a.w,w))out.push({day:q.day,label:'写作缺词',stem:w,mine:'没用上',right:w,why:q.writing.tip});
    });
  }
  out.sort(function(x,y){return x.day-y.day;});
  return out;
}
function errWordCard(x){

  if(it.en)sub='<div class="sent"><div class="en">'+esc(it.en)+'</div>'+(it.cn?'<div class="cn">'+esc(it.cn)+'</div>':'')+'</div>';

  var st=x.sched.s||0,due=dueText(x.sched.due);
  var urgent=String(x.sched.due)<=todayStr();
  return '<div class="card unknown"><div class="wline"><span class="word">'+esc(it.w)+'</span>'+spkBtn(it.w)+'<span class="ph">/'+esc(it.ph||'')+'/</span>'
    +'<span class="errbadge" style="'+(urgent?'':'background:#e0e7ff;color:#3730a3')+'">D'+x.day+' '+CATNAME[x.cat]+'</span></div>'
    +'<div class="mean">'+esc(it.m)+'</div>'+(it.col?'<div class="col">'+esc(it.col)+'</div>':'')+sub
    +'<div class="col">第 '+(st+1)+'/'+(REV.length+1)+' 轮 · '+esc(due)+'</div>'

    +'<button class="mk no" onclick="errAgain(\''+x.cat+'\',\''+esc(it.w).replace(/'/g,"\\'")+'\')">✗ 还是不会</button>'
    +'<button class="mk" onclick="errGo('+x.day+',\''+x.cat+'\')">去原页</button></div></div>';

function errQuizCard(e){
  return '<div class="errq"><div style="font-size:12px;color:var(--sub)"><b style="color:var(--ink)">D'+e.day+' · '+esc(e.label)+'</b></div>'
    +'<div style="margin-top:4px">'+esc(e.stem)+'</div>'
    +'<div class="qwhy">你的：'+esc(e.mine)+'　正确：'+esc(e.right)+'<br>'+esc(e.why)+'</div>'
    +'<div class="marks"><button class="mk" onclick="errQuizGo('+e.day+')">去看那套题</button></div></div>';

function searchList(query){
  var h='',n=0,i,c,j;
  for(i=0;i<DAYS.length&&n<20;i++){
    var d=DAYS[i];
    for(c in CATNAME){
      for(j=0;j<d[c].length;j++){
        var it=d[c][j];
        if((String(it.w)+' '+String(it.m)).toLowerCase().indexOf(query)<0)continue;
        var st=state.marks[key(c,it.w)];
        h+='<div class="card'+(st===1?' known':(st===0?' unknown':''))+'"><div class="wline"><span class="word">'+esc(it.w)+'</span>'+spkBtn(it.w)+'<span class="ph">/'+esc(it.ph||'')+'/</span>'
          +'<span class="errbadge" style="background:#e0e7ff;color:#3730a3">D'+d.day+' '+CATNAME[c]+'</span></div>'
          +'<div class="mean">'+esc(it.m)+'</div>'
          +'<div class="marks"><button class="mk" onclick="errGo('+d.day+',\''+c+'\')">去原页</button>'+(st===1?'<span class="chipw on" style="align-self:center">已掌握</span>':'')+'</div></div>';
        n++;
        if(n>=20)break;
      }
      if(n>=20)break;
    }
  }
  return n?h:'<div class="empty">没找到，换个词或中文义试试。</div>';
}
function errBodyHtml(ws,qs,query){
  if(query)return '<div class="qhint">搜索「'+esc(query)+'」</div>'+searchList(query);
  var f=state.errFilter,h='';
  var wlist=ws.filter(function(x){if(f==='due')return String(x.sched.due)<=todayStr();return f==='all'?true:(f==='quiz'?false:x.cat===f);});
  var qlist=(f==='all'||f==='quiz')?qs:[];
  if(wlist.length)h+=wlist.map(errWordCard).join('');
  else if(f!=='quiz')h+='<div class="empty">这一类没有错词。在卡片点 ✗ 不认识，词会自动进这里。</div>';
  if(qlist.length){
    h+='<div class="qh" style="margin-top:12px"><span class="qtag t">小测</span>错题</div>'+qlist.map(errQuizCard).join('');
  }
  return h;
}

window.exportWrong=function(){
  var ws=wrongWords(),qs=quizErrors(),lines=[LVN+'错词本 '+todayStr(),''];
  lines.push('【未攻克单词 '+ws.length+'】');
  ws.forEach(function(x){lines.push(x.it.w+'  /'+(x.it.ph||'')+'/  '+x.it.m+'   (D'+x.day+' '+CATNAME[x.cat]+'，第'+((x.sched.s||0)+1)+'轮，'+dueText(x.sched.due)+')');});
  lines.push('','【小测错题 '+qs.length+'】');

  var blob=new Blob([lines.join('\r\n')],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=LVN+'错词本_'+todayStr()+'.txt';a.click();

    document.getElementById('prog').innerHTML='错词 <b>'+wrongWords().length+'</b> 个待攻克';
    return;
  }
  var d=DAYS[state.day],arr=d[state.cat];
  var known=arr.filter(function(it){return state.marks[key(state.cat,it.w)]===1;}).length;

}

/* ---------- 云同步（链接即云端） ---------- */
var BDATE='2026-11-22', SLOTS=null, SLOTMAP=null;
function b36(n){return n.toString(36);}
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+/g,'');}
function b64d(str){var x=String(str).replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';return decodeURIComponent(escape(atob(x)));}
function buildSlots(){
  if(SLOTS)return;
  SLOTS=[];SLOTMAP={};
  DAYS.forEach(function(d){
    ['reading','writing','translation','listening'].forEach(function(c){
      d[c].forEach(function(it){
        var k=key(c,it.w);
        if(!SLOTMAP[k])SLOTMAP[k]=[];
        SLOTMAP[k].push(SLOTS.length);SLOTS.push(k);
      });
    });
  });
}
function rle(a){var out=[],i=0;while(i<a.length){var j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;out.push(i===j?b36(a[i]):b36(a[i])+'-'+b36(a[j]));i=j+1;}return out.join(',');}
function unrle(str){var out=[];if(!str)return out;String(str).split(',').forEach(function(pp){var q=pp.split('-'),x=parseInt(q[0],36);out.push(x);if(q[1]){for(var t=x+1;t<=parseInt(q[1],36);t++)out.push(t);}});return out;}
function dateFromBase(n){var d=new Date(BDATE.replace(/-/g,'/')+' 00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
window.makeCode=function(){
  buildSlots();
  var known=[],unknown=[],seen={},sched=[];
  SLOTS.forEach(function(k,i){
    if(seen[k])return;seen[k]=1;
    var st=state.marks[k];
    if(st===1)known.push(i);
    else if(st===0){unknown.push(i);var sc=state.sched[k];if(sc)sched.push(b36(i)+'.'+sc.s+'.'+dayDiff(sc.due,BDATE));}
  });
  var q={};
  for(var d in state.daily){var a=state.daily[d];if(!a)continue;
    q[d]=[a.l||[],a.r||[],String(a.t||'').slice(0,160),String(a.w||'').slice(0,160),a.submitted?1:0];
  }
  return b64e(JSON.stringify({v:1,k:rle(known),u:rle(unknown),s:sched.join(';'),q:q,t:todayStr()}));
};
window.syncURL=function(){return location.href.split('#')[0]+'#sync='+makeCode();};
function summarize(o){
  return '已掌握 '+unrle(o.k).length+' 词 · 小测 '+Object.keys(o.q||{}).length+' 天';
}
function applyCode(o){
  buildSlots();
  var known=unrle(o.k),unknown=unrle(o.u),st={};
  known.forEach(function(i){st[i]=1;});unknown.forEach(function(i){st[i]=0;});
  SLOTS.forEach(function(k,i){if(st[i]!==undefined)state.marks[k]=st[i];});
  var sc={};
  if(o.s)o.s.split(';').forEach(function(pp){var q=pp.split('.');var i=parseInt(q[0],36);if(SLOTS[i])sc[keyOfSlot(i)]={s:parseInt(q[1],10)||0,due:dateFromBase(parseInt(q[2],10)||0),n:0};});
  function keyOfSlot(i){return SLOTS[i];}
  state.sched=sc;
  var dl={};
  for(var d in (o.q||{})){var a=o.q[d];dl[d]={l:a[0]||[],r:a[1]||[],t:a[2]||'',w:a[3]||'',submitted:!!a[4]};}
  state.daily=dl;
  save();renderDays&&renderDays();renderTabs();renderTip();renderCards();renderTask&&renderTask();renderBanner&&renderBanner();updateProg();
}
function extractCode(str){
  str=String(str||'').trim();
  var m=str.match(/sync=([^&#\s]+)/);
  return m?m[1]:str;
}
function tryApply(str,ask){
  try{
    var o=JSON.parse(b64d(extractCode(str)));
    if(!o||o.v!==1)throw new Error('版本不符');
    if(ask&&!confirm('打开链接恢复进度？会覆盖本机当前记录。'))return false;
    applyCode(o);
    localStorage.setItem('cet_entered','1');
    var gate=document.getElementById('gate');if(gate)gate.classList.remove('open');
    var logo=document.querySelector('.logo');if(logo)logo.innerHTML=(LV==='cet4'?'四级':'六级')+'<b>冲刺</b>背诵';
    var cd=document.getElementById('countdown');if(cd)cd.style.display='';
    alert('已恢复：'+summarize(o));
    return true;
  }catch(e){alert('恢复失败：'+e.message);return false;}
}
function authErrText(msg){return /bad credentials|401|unauthorized/i.test(String(msg||''));}
function clearAuthState(){
 ['gh_token','gh_gist_id','cet_user','gh_scope'].forEach(function(k){localStorage.removeItem(k);});
 localStorage.setItem('sync_error','登录已失效，请重新登录');

  document.getElementById('syncBody').innerHTML=h;

window.showSyncToast=function(t){
  var el=document.getElementById('syncToast');

function copyText(t,cb){
  var ta=document.createElement('textarea');
  ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';ta.style.opacity='0';
  document.body.appendChild(ta);
  var ok=false;
  try{ta.select();ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  if(ok){if(cb)cb();return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){if(cb)cb();}).catch(function(){try{prompt('复制这条链接',t);}catch(e){}});
  }else try{prompt('复制这条链接',t);}catch(e){}
}
